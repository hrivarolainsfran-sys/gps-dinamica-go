}

let activeWarn = null, lastEv = null;
function publishLive(force) {
  if (!T || !T.pantalla || !Cloud.ok) return;
  const pos = Geo.pos, now = Date.now();
  const tgt = T.done ? null : target();
  Cloud.pushLive({
    run: T.start, name: T.name || 'Jugador', start: T.start, score: T.score,
    visited: Object.keys(T.visited), warned: Object.keys(T.warned), fallen: Object.keys(T.fallen),
    avoided: Object.keys(T.avoided).filter(k => T.avoided[k].ok),
    pos: pos ? { lat: +pos.lat.toFixed(6), lng: +pos.lng.toFixed(6), acc: pos.acc || 0 } : null,
    t: now, weak: !pos || pos.acc > WEAK_ACC || now - pos.t > 30000,
    trail: (T.trail || []).slice(-400).flat(),
    target: tgt ? tgt.id : null, lockUntil: T.lockUntil || 0, done: T.done || 0,
    warn: activeWarn ? { id: activeWarn.id, d: activeWarn.d, ans: activeWarn.ans == null ? null : activeWarn.ans } : null,
    ev: lastEv
  }, force);
}
function openWarn(t, d) {
  Sound.warn(); buzz([220, 90, 220, 90, 220]);
  activeWarn = { id: t.id, d };
  publishLive(true);
  const opts = shuffle(t.options.map((o, i) => ({ o, i })));
  const w = openSheet(`<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Recalculando</div><h2>Reporte de peligro a ${d} m</h2></div>
    <div class="sheet-body">
      <p>Cerca hay un cartel que parece un buen camino, pero otros conductores lo reportaron. Léanlo juntos:</p>
      <div class="cartel-quote">«${esc(t.sign)}»</div>
      <p><b>${esc(t.q)}</b></p>
      ${T.pantalla ? '<p class="class-q">Clase: ¿qué le responderían? Díganlo en voz alta antes de que elija.</p>' : ''}
      <div class="opts">${opts.map(x => `<button class="opt" data-i="${x.i}">${esc(x.o)}</button>`).join('')}</div>
      <div class="feedback" hidden></div>
      <button class="btn primary block" id="wDone" hidden>Desviar y seguir</button>
    </div>`, () => { activeWarn = null; publishLive(true); updateGame(); });
  updateGame();
  w.querySelector('.opts').addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b || T.avoided[t.id]) return;
    const ok = +b.dataset.i === t.ok;
    T.avoided[t.id] = { ok, at: Date.now() }; if (ok) T.score += 50; saveT();
    if (activeWarn) { activeWarn.ans = ok; publishLive(true); }
    w.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (+o.dataset.i === t.ok) o.classList.add('ok'); else if (o === b) o.classList.add('no'); });
    const fb = w.querySelector('.feedback'); fb.hidden = false;
    fb.innerHTML = (ok ? '<div class="pts good">+50</div><p><b>¡Desvío a tiempo!</b></p>' : '<p><b>Esa no era.</b> La respuesta correcta está en verde.</p>') +
      `<p>${esc(t.why)}</p><p class="small">No escaneen ese cartel: es una trampa.</p>`;
    if (ok) Sound.good(); else Sound.tone(300, .3);
    w.querySelector('#wDone').hidden = false; updateGame();
  });
  w.querySelector('#wDone').onclick = closeSheet;
}

function handleCode(raw) {
  if (view !== 'team' || !T || T.done) return;
  const code = String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  const pr = BY_CODE[code];
  if (!pr) return sheetMsg('No reconozco ese código', 'Revisen las letras y números del cartel e inténtenlo de nuevo.');
  const p = gp(pr.id);
  if (!p) return sheetMsg('Ese cartel no está en el juego de hoy', 'Sigan buscando los puntos de su ruta.');
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  if (p.type === 'trap') return fallTrap(p);
  if (T.visited[p.id]) return sheetMsg('Ya pasaron por aquí', `«${p.sign}» ya está en su ruta. Sigan al próximo destino.`);
  if (p.type === 'dest') {
    const left = goods().filter(g => !T.visited[g.id]).length;
    if (left) return sheetMsg('Todavía no es el final', `Les falta${left > 1 ? 'n' : ''} ${left} punto${left > 1 ? 's' : ''} antes de llegar a la capilla.`);
  }
  T.visited[p.id] = Date.now(); T.score += 100;
  Sound.good(); buzz([60, 40, 60]);
  lastEv = { type: p.type === 'dest' ? 'dest' : 'good', id: p.id, at: Date.now() };
  if (p.type === 'dest') { T.done = Date.now(); saveT(); publishLive(true); return showFinal(); }
  saveT(); publishLive(true);
  const n = goodsDone(), tot = goods().length;
  const w = openSheet(`<div class="sheet-head"><div class="sh-k">Punto ${n} de ${tot}</div><h2>${esc(p.title)}</h2></div>
    <div class="sheet-body"><div class="pts good">+100</div><div class="cartel-quote">«${esc(p.sign)}»</div><p>${esc(p.body)}</p><p class="ref">${esc(p.ref)}</p>
    <button class="btn primary block">${n === tot ? 'Rumbo a la capilla' : 'Siguiente destino'}</button></div>`, () => updateGame());
  w.querySelector('.btn').onclick = closeSheet;
}

function fallTrap(t) {
  if (T.fallen[t.id]) return sheetMsg('Ya cayeron en esta trampa', 'No hace falta escanearla otra vez. Sigan la ruta del GPS.');
  T.fallen[t.id] = Date.now(); T.score -= 50; T.lockUntil = Date.now() + LOCK_MS; saveT();
  lastEv = { type: 'trap', id: t.id, at: Date.now() }; publishLive(true);
  Sound.bad(); buzz([400, 120, 400]);
  const w = openSheet(`<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Cayeron en una trampa</div><h2>«${esc(t.sign)}»</h2></div>
    <div class="sheet-body"><div class="pts bad">−50</div><p>${esc(t.why)}</p>
    <p class="small">El GPS está recalculando la ruta: esperen <span id="cd">15</span> segundos antes de seguir.</p>
    <button class="btn primary block">Entendido</button></div>`, () => updateGame());
  const iv = setInterval(() => { const el = w.querySelector('#cd'); if (!el) return clearInterval(iv); const s = Math.ceil((T.lockUntil - Date.now()) / 1000); if (s <= 0) { el.textContent = '0'; clearInterval(iv); } else el.textContent = s; }, 500);
  w.querySelector('.btn').onclick = closeSheet;
}

let camStream = null, camOn = false;
function stopCam() { camOn = false; if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function extractCode(v) {
  const m = /[#?&]c=([A-Za-z0-9]{3})/.exec(v); if (m) return m[1].toUpperCase();
  const t = String(v).trim().toUpperCase(); return /^[A-Z0-9]{3}$/.test(t) ? t : null;
}
async function openScanner() {
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  const w = openSheet(`<div class="sheet-head"><div class="sh-k">${ICON.scan} Escanear cartel</div><h2>Apunten la cámara al QR</h2></div>
    <div class="sheet-body"><div class="cam"><video id="vid" playsinline muted autoplay></video><div class="cam-frame"></div></div>
    <p class="small" id="camMsg">Antes de escanear, discutan juntos: ¿este cartel los lleva por buen camino?</p>
    <div class="row"><button class="btn" id="toCode" style="flex:1">Escribir código</button><button class="btn" id="camX" style="flex:1">Cerrar</button></div></div>`, stopCam);
  w.querySelector('#camX').onclick = closeSheet;
  w.querySelector('#toCode').onclick = () => { closeSheet(); openCode(); };
  const video = w.querySelector('#vid');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (sheetEl !== w) { stopCam(); return; }
    video.srcObject = camStream; await video.play();
  } catch (e) {
    const m = w.querySelector('#camMsg'); if (m) m.innerHTML = '<b>No se pudo abrir la cámara.</b> Escriban el código del cartel o escanéenlo con la cámara del celular.';
    return;
  }
  camOn = true;
  let detector = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (!camOn || sheetEl !== w) return;
    let val = null;
    if (video.readyState >= 2) {
      if (detector) { try { const r = await detector.detect(video); if (r && r[0]) val = r[0].rawValue; } catch (e) { detector = null; } }
      else if (window.jsQR && video.videoWidth) {
        const sc = Math.min(1, 640 / video.videoWidth);
        canvas.width = Math.round(video.videoWidth * sc); canvas.height = Math.round(video.videoHeight * sc);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }); if (r) val = r.data;
      }
    }
    if (val) {
      const code = extractCode(val);
      if (code) { closeSheet(); handleCode(code); return; }
      if (/#j=/.test(val)) { const m = w.querySelector('#camMsg'); if (m) m.textContent = 'Ese es el QR para unirse al juego. Escaneen el QR de un cartel.'; }
    }
    setTimeout(tick, 200);
  };
  tick();
}
function openCode() {
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  const w = openSheet(`<div class="sheet-head off"><div class="sh-k">Código del cartel</div><h2>Escriban las 3 letras y números</h2></div>
    <div class="sheet-body"><form id="cf" style="display:grid;gap:12px"><input class="codein" id="codeIn" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="···" aria-label="Código del cartel">
    <button class="btn primary block" type="submit">Confirmar</button></form><button class="btn block" id="cX">Cancelar</button></div>`);
  setTimeout(() => { const i = w.querySelector('#codeIn'); if (i) i.focus(); }, 60);
  w.querySelector('#cf').onsubmit = e => { e.preventDefault(); const v = w.querySelector('#codeIn').value; closeSheet(); handleCode(v); };
  w.querySelector('#cX').onclick = closeSheet;
}
function openMenu() {
  const needCompass = Compass.needsPermission() && Compass.heading == null;
  const w = openSheet(`<div class="sheet-head off"><div class="sh-k">${esc(teamLabel(T))}</div><h2>Opciones</h2></div>
    <div class="sheet-body"><div class="menu">
      ${needCompass ? '<button class="btn block" data-m="compass">Activar brújula</button>' : ''}
      <button class="btn block" data-m="code">Escribir código de un cartel</button>
      <button class="btn block" data-m="home">Salir al inicio</button>
      <div id="mReset"><button class="btn danger block" data-m="reset">Reiniciar este equipo</button></div>
      <button class="btn primary block" data-m="close">Volver al recorrido</button>
    </div></div>`);
  w.addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m === 'close') closeSheet();
    if (m === 'compass') { Compass.start(); closeSheet(); toast('Brújula activada'); }
    if (m === 'code') { closeSheet(); openCode(); }
    if (m === 'home') showHome();
    if (m === 'reset') $('#mReset', w).innerHTML = '<p><b>¿Seguro?</b> Se pierden los puntos y el tiempo de este equipo.</p><div class="row"><button class="btn danger" data-m="resetYes" style="flex:1">Sí, reiniciar</button><button class="btn" data-m="close" style="flex:1">Cancelar</button></div>';
    if (m === 'resetYes') { store.del(tKey()); T = null; showTeam(); }
  });
}

const PUNTO2 = `<div class="card next"><p class="kicker">Lo que sigue · Punto 2</p><h2>Enviados por el Espíritu Santo</h2>
  <p class="verse">«Entonces Bernabé y Saulo fueron enviados por el Espíritu Santo».</p><p class="ref">Hechos 13:4 (NTV)</p>
  <p>El que guía es el mismo que envía. La misión no es un proyecto nuestro que el Espíritu apoya: es su obra, y nosotros participamos.</p></div>`;
function showFinal() {
  Geo.stop();
  const ok = Object.values(T.avoided).filter(a => a.ok).length, fell = Object.keys(T.fallen).length;
  setView('final', `<main class="page">
    <div class="hero-sign"><span class="hero-arrow">${ICON.flag}</span><p class="kicker light">${T.pantalla ? 'Llegó' : 'Llegaron'} a la capilla · ${esc(teamLabel(T))}</p>
      <h1>${T.score} puntos</h1><p>Tiempo: ${fmtTime(T.done - T.start)}</p></div>
    <div class="stats3">
      <div><strong>${goodsDone()}</strong><span>puntos que guían</span></div>
      <div><strong>${ok}</strong><span>trampas detectadas</span></div>
      <div><strong>${fell}</strong><span>trampas en las que cayeron</span></div>
    </div>
    ${window.L && (T.trail || []).length > 1 ? '<p class="kicker">Así fue el recorrido</p><div class="final-map" id="fmap"></div>' : ''}
    <div class="card"><p class="kicker">Frase del punto 1</p><h2>El Espíritu guía a sus hijos y les enseña a discernir juntos.</h2></div>
    ${PUNTO2}
    <p>${esc(BY_ID.capilla.body)}</p>
    <p class="lead center"><b>${T.pantalla ? '¡Un aplauso para quien manejó!' : 'Muéstrenle esta pantalla a su líder.'}</b></p>
    ${isSim() ? '<button class="btn primary block" id="fAgain">Probar de nuevo</button><a class="btn block" href="#lider">Volver al modo líder</a>' : '<button class="btn block" id="fHome">Inicio</button>'}
  </main>`);
  Sound.good();
  if ($('#fmap')) {
    const fm = L.map('fmap', { zoomControl: false, attributionControl: true });
    tiles(fm);
    L.polyline(T.trail, { color: '#ffffff', weight: 11, opacity: .9 }).addTo(fm);
    const line = L.polyline(T.trail, { color: '#0B6B45', weight: 6, opacity: .95 }).addTo(fm);
    game.p.forEach(r => {
      const p = gp(r[0]); if (!p || p.lat == null) return;
      let kind = null;
      if (p.type === 'trap') { if (T.warned[p.id] || T.fallen[p.id] || T.avoided[p.id]) kind = 'trap'; }
      else if (T.visited[p.id]) kind = p.type === 'dest' ? 'destL' : 'visited';
      if (kind) L.marker([p.lat, p.lng], { icon: mkIcon(kind, ''), interactive: false, keyboard: false }).addTo(fm);
    });
    fm.fitBounds(line.getBounds(), { padding: [30, 30], maxZoom: 19 });
    cleanup.push(() => fm.remove());
  }
  const a = $('#fAgain'); if (a) a.onclick = () => { store.del(tKey()); T = null; showTeam(); };
  const h = $('#fHome'); if (h) h.onclick = () => showHome();
}

/* ---------- Pantalla grande (espectador, en la computadora del proyector) ---------- */
function showScreen() {
  Geo.stop();
  if (!Cloud.ok) {
    return setView('screen', `<main class="page">
      <div class="hero-sign"><span class="hero-arrow">${ICON.nosig}</span><p class="kicker light">Pantalla grande</p><h1>Falta conectar la nube</h1><p>La transmisión en vivo necesita Firebase</p></div>
      <p class="lead">Mientras tanto, conecta el celular del jugador al proyector, o usa la <a href="../">presentación «El GPS y la señal perdida»</a> como plan B.</p></main>`);
  }
  setView('screen', `<div class="tv screen">
    <header class="nav" id="nav" data-tone="off" aria-live="polite">
      <div class="nav-ico" id="navIco">${ICON.spin.replace('<svg', '<svg class="spinning"')}</div>
      <div style="min-width:0"><div class="nav-dist" id="navDist" hidden></div><div class="nav-text" id="navText">Esperando al jugador…</div><span class="nav-chip" id="navChip" hidden></span></div>
    </header>
    <div class="tv-map"><div id="tmap"></div><div class="live-badge" id="liveBadge">EN VIVO</div>
      <div class="scr-wait" id="scrWait"><div class="card"><h2>Esperando al jugador</h2><p>Cuando toque «Empezar recorrido» en su celular, su camino aparece aquí en vivo.</p></div></div></div>
    <aside class="side">
      <p class="kicker" id="scrWho">Ruta a la capilla</p>
      <h2 id="sideNext">Esperando al jugador…</h2>
      <div class="stats3 mini"><div><strong id="sScore">0</strong><span>puntos</span></div><div><strong id="sProg">0/0</strong><span>ruta</span></div><div><strong id="sTime">0:00</strong><span>tiempo</span></div></div>
      <ul class="legend">
        <li>${pin('#0B6B45', PIN_IN.dot)}<span>Próximo punto</span></li>
        <li>${pin('#7B8A82', PIN_IN.check)}<span>Punto visitado</span></li>
        <li>${pin('#C33A2E', PIN_IN.bang)}<span>Trampa detectada</span></li>
        <li>${pin('#B07A00', PIN_IN.flag)}<span>La capilla</span></li>
        <li><span class="me"></span><span>Jugador</span></li>
        <li><span class="trail"></span><span>Camino recorrido</span></li>
      </ul>
      <button class="btn small" id="sndBtn">Activar sonido</button>
      <p class="small" id="scrStale"></p>
    </aside>
    <div class="scr-over" id="scrOver" hidden></div>
  </div>`);

  let R = null, D = null, map = null, me = null, meAcc = null, trailCase = null, trailLine = null, marks = {}, fitted = false;
  let overKey = '', lastWarnId = '', lastEvAt = 0, evUntil = 0, evHTML = '', lastRot = null;
  const P = id => { if (!R) return null; const r = R.p.find(x => x[0] === id); return r && BY_ID[id] ? { ...BY_ID[id], lat: r[1], lng: r[2], hint: r[3] || '' } : null; };
  const goodsR = () => R ? R.p.filter(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'good').map(r => r[0]) : [];
  const hasDest = () => !!(R && R.p.some(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'dest'));

  if (window.L) {
    map = L.map('tmap', { zoomControl: false }).setView([-15, -60], 3);
    tiles(map);
    trailCase = L.polyline([], { color: '#ffffff', weight: 12, opacity: .9, interactive: false }).addTo(map);
    trailLine = L.polyline([], { color: '#0B6B45', weight: 7, opacity: .95, interactive: false }).addTo(map);
    cleanup.push(() => map.remove());
  } else $('#tmap').innerHTML = '<div class="map-off">El mapa necesita internet.</div>';

  function nav(tone, icon, distTxt, text, chip, rot) {
    const n = $('#nav'); if (!n) return;
    n.dataset.tone = tone;
    const ic = $('#navIco');
    if (ic.dataset.icon !== icon) { ic.innerHTML = ICON[icon]; ic.dataset.icon = icon; lastRot = null; }
    const svg = ic.firstElementChild;
    if (svg) {
      svg.classList.toggle('spinning', icon === 'spin');
      if (rot != null) { let r = rot; if (lastRot != null) { while (r - lastRot > 180) r -= 360; while (r - lastRot < -180) r += 360; } lastRot = r; svg.style.transform = `rotate(${r}deg)`; }
      else svg.style.transform = '';
    }
    const d = $('#navDist'); d.textContent = distTxt || ''; d.hidden = !distTxt;
    $('#navText').textContent = text;
    const c = $('#navChip'); c.textContent = chip || ''; c.hidden = !chip;
  }
  function drawMarks(tgtId) {
    if (!map || !R) return;
    const vis = new Set(D ? D.visited || [] : []), seen = new Set(D ? [...(D.warned || []), ...(D.fallen || []), ...(D.avoided || [])] : []);
    R.p.forEach(r => {
      const p = P(r[0]); if (!p || p.lat == null) return;
      let kind = null, label = '';
      if (p.type === 'trap') { if (seen.has(p.id)) { kind = 'trap'; label = 'Trampa'; } }
      else if (vis.has(p.id)) kind = p.type === 'dest' ? 'destL' : 'visited';
      else if (tgtId === p.id) { kind = p.type === 'dest' ? 'dest' : 'target'; label = p.type === 'dest' ? 'Capilla' : 'Próximo'; }
      else if (p.type === 'dest') kind = 'destL';
      const key = kind + label, m = marks[p.id];
      if (!kind) { if (m) { m.remove(); delete marks[p.id]; } return; }
      if (m && m._key === key) return;
      if (m) m.remove();
      const nm = L.marker([p.lat, p.lng], { icon: mkIcon(kind, label), interactive: false, keyboard: false }).addTo(map);
      nm._key = key; marks[p.id] = nm;
    });
  }
  function overlay(key, html) {
    const o = $('#scrOver'); if (!o) return;
    if (!html) { o.hidden = true; overKey = ''; return; }
    if (overKey === key) return;
    overKey = key; o.innerHTML = `<div class="sheet big">${html}</div>`; o.hidden = false;
  }
  function warnHTML(w) {
    const t = BY_ID[w.id]; if (!t) return '';
    const answered = w.ans === true || w.ans === false;
    return `<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Recalculando</div><h2>Reporte de peligro a ${w.d} m</h2></div>
      <div class="sheet-body"><div class="cartel-quote">«${esc(t.sign)}»</div><p><b>${esc(t.q)}</b></p>
      ${answered ? '' : '<p class="class-q">Clase: ¿qué le responderían? Díganlo en voz alta antes de que elija.</p>'}
      <div class="opts">${t.options.map((o, i) => `<div class="opt ${answered && i === t.ok ? 'ok' : ''}">${esc(o)}</div>`).join('')}</div>
      ${answered ? (w.ans ? '<div class="pts good">+50 · ¡Desvío a tiempo!</div>' : '<p><b>Esa no era.</b> La respuesta correcta está en verde.</p>') + `<p>${esc(t.why)}</p>` : ''}</div>`;
  }
  function evHTMLFor(ev) {
    const p = BY_ID[ev.id]; if (!p) return '';
    if (ev.type === 'trap') return `<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Cayó en una trampa</div><h2>«${esc(p.sign)}»</h2></div><div class="sheet-body"><div class="pts bad">−50</div><p>${esc(p.why)}</p><p class="small">Recalculando: 15 segundos de espera.</p></div>`;
    return `<div class="sheet-head"><div class="sh-k">Punto alcanzado</div><h2>${esc(p.title)}</h2></div><div class="sheet-body"><div class="pts good">+100</div><div class="cartel-quote">«${esc(p.sign)}»</div><p>${esc(p.body)}</p><p class="ref">${esc(p.ref)}</p></div>`;
  }
  function finalHTML() {
    const ok = (D.avoided || []).length, fell = (D.fallen || []).length;
    return `<div class="sheet-head"><div class="sh-k">${ICON.flag} Llegó a la capilla · ${esc(D.name || 'Jugador')}</div><h2>${D.score} puntos · ${fmtTime(D.done - D.start)}</h2></div>
      <div class="sheet-body"><div class="stats3"><div><strong>${(D.visited || []).filter(id => BY_ID[id] && BY_ID[id].type === 'good').length}</strong><span>puntos que guían</span></div><div><strong>${ok}</strong><span>trampas detectadas</span></div><div><strong>${fell}</strong><span>trampas en las que cayó</span></div></div>
      <div class="card"><p class="kicker">Frase del punto 1</p><h2>El Espíritu guía a sus hijos y les enseña a discernir juntos.</h2></div>${PUNTO2}</div>`;
  }

  function render() {
    if (view !== 'screen') return;
    const now = Date.now();
    const waiting = !D || !D.run;
    $('#scrWait').hidden = !waiting;
    $('#liveBadge').hidden = waiting;
    if (waiting) {
      nav('off', 'spin', '', 'Esperando al jugador…', 'Ruta a la capilla');
      $('#sideNext').textContent = 'Esperando al jugador…'; $('#scrWho').textContent = 'Ruta a la capilla';
      $('#sScore').textContent = '0'; $('#sTime').textContent = '0:00'; $('#sProg').textContent = `0/${goodsR().length + (hasDest() ? 1 : 0)}`;
      if (trailLine) { trailLine.setLatLngs([]); trailCase.setLatLngs([]); }
      if (me) { me.remove(); meAcc.remove(); me = meAcc = null; }
      drawMarks(null); overlay('', ''); $('#scrStale').textContent = '';
      return;
    }
    $('#scrWho').textContent = 'En vivo · ' + (D.name || 'Jugador');
    $('#liveBadge').textContent = 'EN VIVO · ' + (D.name || 'Jugador').toUpperCase();
    $('#sScore').textContent = D.score;
    $('#sProg').textContent = `${(D.visited || []).length}/${goodsR().length + (hasDest() ? 1 : 0)}`;
    $('#sTime').textContent = fmtTime((D.done || now) - D.start);
    const age = Math.round((now - D.t) / 1000);
    $('#scrStale').textContent = !D.done && age > 15 ? `Última señal del celular del jugador hace ${age} s.` : '';

    const tr = []; const f = D.trail || []; for (let i = 0; i + 1 < f.length; i += 2) tr.push([f[i], f[i + 1]]);
    if (trailLine) { trailLine.setLatLngs(tr); trailCase.setLatLngs(tr); }
    if (map && D.pos) {
      const ll = [D.pos.lat, D.pos.lng];
      if (!me) {
        meAcc = L.circle(ll, { radius: D.pos.acc || 5, color: '#1F6FEB', weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
        me = L.circleMarker(ll, { radius: 11, color: '#fff', weight: 4, fillColor: '#1F6FEB', fillOpacity: 1, interactive: false }).addTo(map);
      } else { me.setLatLng(ll); meAcc.setLatLng(ll).setRadius(D.pos.acc || 5); }
      if (!fitted) { map.setView(ll, 19); fitted = true; }
      else if (!map.getBounds().pad(-0.25).contains(ll)) map.panTo(ll);
    }
    const tgt = D.target ? P(D.target) : null;
    drawMarks(tgt ? tgt.id : null);

    const vg = (D.visited || []).filter(id => BY_ID[id] && BY_ID[id].type === 'good').length;
    const label = tgt ? (tgt.type === 'dest' ? 'Destino final: la capilla' : `Punto ${vg + 1} de ${goodsR().length}`) : '';
    $('#sideNext').textContent = D.done ? 'Llegó a la capilla' : D.warn ? 'Trampa a la vista: ¿qué le responderían?' : now < D.lockUntil ? 'Recalculando después de una trampa' : tgt ? (tgt.type === 'dest' ? 'Rumbo a la capilla' : `Rumbo al punto ${vg + 1} de ${goodsR().length}`) : '';
    if (D.done) nav('go', 'flag', 'Llegó', 'Recorrido completo', null);
    else if (D.warn) nav('stop', 'warn', 'Peligro', `Trampa a ${D.warn.d} m`, 'Recalculando');
    else if (now < D.lockUntil) nav('warn', 'spin', Math.ceil((D.lockUntil - now) / 1000) + ' s', 'Recalculando… cayó en una trampa', null);
    else if (!tgt) nav('go', 'flag', '', 'Recorrido completo', null);
    else if (tgt.lat == null) nav('off', 'qr', 'Bajo techo', label + (tgt.hint ? ' · ' + tgt.hint : ''), 'Busca el cartel');
    else if (D.weak || !D.pos) nav('off', 'nosig', 'Sin señal', label, 'Sigue por la ruta marcada');
    else {
      const d = dist(D.pos, tgt);
      if (d <= ((R && R.r && +R.r[1]) || ARRIVE_R)) nav('go', 'flag', 'Llegó', label + ' · busca el cartel', 'En la zona');
      else nav('go', 'arrow', fmtDist(d), label + (tgt.hint ? ' · ' + tgt.hint : ''), 'Flecha = norte del mapa', bearing(D.pos, tgt));
    }

    if (D.warn) {
      if (D.warn.id !== lastWarnId) { lastWarnId = D.warn.id; Sound.warn(); }
      overlay('w' + D.warn.id + String(D.warn.ans), warnHTML(D.warn));
    } else if (D.done) {
      if (overKey !== 'final' + D.run) Sound.good();
      overlay('final' + D.run, finalHTML());
    } else {
      if (D.ev && D.ev.at > lastEvAt && D.ev.at >= D.start && now - D.ev.at < 15000) {
        lastEvAt = D.ev.at; evUntil = now + 8000; evHTML = evHTMLFor(D.ev);
        if (D.ev.type === 'trap') Sound.bad(); else Sound.good();
      }
      if (now < evUntil && evHTML) overlay('e' + lastEvAt, evHTML); else overlay('', '');
      if (!D.warn) lastWarnId = '';
    }
  }

  const unR = Cloud.routeRef().onSnapshot(s => {
    R = s.exists ? Cloud.fromCloud(s.data()) : null;
    Object.values(marks).forEach(m => m.remove()); marks = {};
    if (map && R && !fitted) {
      const pts = R.p.filter(r => r[1] != null).map(r => [r[1], r[2]]);
      if (pts.length) { map.fitBounds(pts, { padding: [60, 60], maxZoom: 19 }); fitted = true; }
    }
    render();
  }, e => { console.error(e); toast('No pude leer el recorrido de la nube.'); });
  const unD = Cloud.liveRef().onSnapshot(s => { D = s.exists ? s.data() : null; render(); }, e => { console.error(e); toast('No pude conectarme a la transmisión.'); });
  const iv = setInterval(render, 1000);
  cleanup.push(unR, unD, () => clearInterval(iv));
  $('#sndBtn').onclick = () => { Sound.init(); Sound.ping(); $('#sndBtn').hidden = true; toast('Sonido activado'); };
  render();
}

route();
})();
</script>
</body>
</html>
