<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6B45">
<title>Ruta a la capilla</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass+Mono:wght@500;700&family=Overpass:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Juego al aire libre: un solo tema claro a propósito, para leer bajo el sol. Lenguaje visual de cartel vial verde. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --ink:#13201A; --muted:#4D5C54; --line:#CBD5CD;
  --sign:#0B6B45; --sign-dark:#08502F; --route:#16A36B;
  --warn:#F3B41C; --warn-ink:#2B1F00; --stop:#C33A2E; --off:#5C6963;
  --good-bg:#DDF1E6; --bad-bg:#FBE3E0;
  --f-display:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-weight:900;font-size:clamp(2rem,1.5rem + 2.5vw,2.8rem);letter-spacing:-.01em}
h2{font-weight:800;font-size:1.35rem}
h3{font-weight:800;font-size:1.05rem}
p{margin:0}
.kicker{font:700 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--sign)}
.kicker.light{color:#fff;opacity:.85}
.small{font-size:.88rem;color:var(--muted)}
.lead{font-size:1.08rem}
.center{text-align:center}
.page{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 36px) max(16px,env(safe-area-inset-left,0px))}
.page.wide{max-width:1100px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:800 1rem/1 var(--f-display);padding:.95em 1.3em .9em;border-radius:999px;border:2px solid var(--ink);background:transparent;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.small{font-size:.86rem;padding:.65em 1em .6em}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.back{font:700 13px var(--f-mono);color:var(--sign);text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:transparent;border-style:dashed}
.notice{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-weight:700}
.stepn{font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* Cartel vial (hero) */
.hero-sign{background:var(--sign);color:#fff;border:7px solid var(--sign);box-shadow:inset 0 0 0 3px #fff;border-radius:18px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:8px}
.hero-sign p:last-child{font:700 1.05rem/1.3 var(--f-display);opacity:.95}
.hero-arrow{width:44px;height:44px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Equipo: preparación */
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font:900 1.3rem/1 var(--f-display)}
.seg button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:#fff}
label.lbl{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.input{width:100%;font:700 1.05rem var(--f-body);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.rules b{font:900 1.05rem var(--f-display);text-align:center;border-radius:8px;padding:6px 0 4px}
.rules .p{background:var(--good-bg);color:var(--sign-dark)} .rules .n{background:var(--bad-bg);color:#8E2219}

/* Equipo: recorrido */
.tv{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}
.nav{background:var(--sign);color:#fff;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;z-index:500;transition:background-color .3s,color .3s;box-shadow:0 6px 18px -10px rgba(0,0,0,.55);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.nav[data-tone="warn"]{background:var(--warn);color:var(--warn-ink)}
.nav[data-tone="stop"]{background:var(--stop)}
.nav[data-tone="off"]{background:var(--off)}
.nav-ico{width:64px;height:64px;display:grid;place-items:center}
.nav-ico svg{width:56px;height:56px;transition:transform .45s ease}
.nav-ico svg.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-dist{font:900 2.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.nav-text{font:700 1.02rem/1.25 var(--f-display);margin-top:3px}
.nav-chip{display:inline-block;font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;background:rgba(255,255,255,.2);padding:5px 8px 4px;border-radius:5px;margin-top:7px}
.nav[data-tone="warn"] .nav-chip{background:rgba(0,0,0,.1)}
.tv-map{position:relative;min-height:0;background:#DCE3DA}
#tmap{position:absolute;inset:0}
.map-off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-weight:700}
.sim{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:var(--ink);color:#fff;font:700 11px var(--f-mono);padding:7px 11px;border-radius:999px;letter-spacing:.05em;white-space:nowrap}
.bar{background:var(--surface);border-top:1px solid var(--line);z-index:500;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px 12px;align-items:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.stat span{display:block;font:700 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat strong{font:800 1.4rem/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.icon-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.bar-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px}
.scan-btn{font-size:1.1rem;padding:1em 1.2em .95em}

/* Pantalla grande (un jugador, la clase mira) */
.side{display:none}
.live-badge{position:absolute;top:10px;left:10px;z-index:600;background:var(--stop);color:#fff;font:700 12px/1 var(--f-mono);letter-spacing:.1em;padding:7px 11px 6px;border-radius:999px;display:flex;gap:7px;align-items:center}
.live-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.tv.pantalla .sim{top:auto;bottom:10px}
.tv.pantalla .nav{grid-template-columns:84px minmax(0,1fr)}
.tv.pantalla .nav-ico{width:84px;height:84px}
.tv.pantalla .nav-ico svg{width:76px;height:76px}
.tv.pantalla .nav-dist{font-size:3.1rem}
.tv.pantalla .nav-text{font-size:1.3rem}
.tv.pantalla .stat strong{font-size:1.7rem}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.legend li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font:700 1rem/1.2 var(--f-display)}
.legend svg{width:26px;height:32px;justify-self:center}
.legend .me{width:18px;height:18px;border-radius:50%;background:#1F6FEB;border:3px solid #fff;box-shadow:0 0 0 1px #1F6FEB;justify-self:center}
.legend .trail{width:30px;height:6px;border-radius:3px;background:#0B6B45;justify-self:center}
.class-q{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font:800 1.05rem/1.3 var(--f-display)}
.sheet.big .cartel-quote{font-size:1.5rem}
.sheet.big .opt{font-size:1.15rem;padding:16px 18px}
.sheet.big h2{font-size:1.7rem}
.final-map{height:280px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#DCE3DA}
@media (orientation:landscape) and (min-width:700px){
  .tv{grid-template-columns:minmax(0,1fr) minmax(300px,34%);grid-template-rows:auto 1fr auto}
  .tv .nav{grid-column:2;grid-row:1}
  .tv .tv-map{grid-column:1;grid-row:1 / span 3}
  .tv .side{display:flex;flex-direction:column;gap:14px;grid-column:2;grid-row:2;background:var(--surface);border-left:1px solid var(--line);padding:18px 20px;overflow:auto;min-height:0}
  .tv .bar{grid-column:2;grid-row:3;border-left:1px solid var(--line)}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:22px}
}

/* Pantalla del proyector */
.tv.screen .nav{grid-template-columns:96px minmax(0,1fr)}
.tv.screen .nav-ico{width:96px;height:96px}
.tv.screen .nav-ico svg{width:86px;height:86px}
.tv.screen .nav-dist{font-size:3.6rem}
.tv.screen .nav-text{font-size:1.4rem}
.tv.screen .side h2{font-size:1.6rem}
.scr-wait{position:absolute;inset:0;z-index:650;background:rgba(238,242,236,.82);display:grid;place-items:center;padding:24px}
.scr-wait .card{max-width:520px;text-align:center}
.scr-over{position:fixed;inset:0;z-index:1500;background:rgba(10,20,15,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.scr-over .sheet{animation:up .35s ease;max-height:92vh;border-radius:22px}
.scr-over .sheet-head{border-radius:22px 22px 0 0}
.stats3.mini strong{font-size:1.6rem}
.stats3.mini div{padding:10px 6px}
@media (orientation:landscape) and (min-width:700px){ .tv.screen .side{grid-row:2 / span 2} }
@media (orientation:portrait){ .tv.screen{grid-template-rows:auto 1fr} }

/* Modo líder: extras */
.range{display:grid;gap:6px}
.range span{display:flex;justify-content:space-between;font-weight:700}
.range input{width:100%;accent-color:var(--sign)}
.gpsline.field{flex-wrap:wrap;font-weight:500;line-height:1.5}
.gpsline .ok{color:var(--sign)} .gpsline .bad{color:var(--stop)}
.check{margin:0;padding-left:1.2em;display:grid;gap:6px}
.check a{color:var(--sign);font-weight:700}
.links{display:grid;gap:12px}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:12px}
.linkrow .linkbox{margin-top:6px}
@media (max-width:480px){ .linkrow{grid-template-columns:1fr} }
details.more{border-top:1px dashed var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.more[open]{display:grid;gap:10px}
.card.next{border-color:var(--sign)}
.card.next .verse{font-style:italic;font-size:1.1rem}
.card.safety{background:var(--good-bg);border-color:transparent}

/* Hojas */
.sheet-wrap{position:fixed;inset:0;z-index:1500;background:rgba(10,20,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:94%;overflow:auto;animation:up .3s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-head{padding:20px 20px 18px;background:var(--sign);color:#fff;border-radius:22px 22px 0 0;display:grid;gap:6px}
.sheet-head.stop{background:var(--stop)} .sheet-head.warn{background:var(--warn);color:var(--warn-ink)} .sheet-head.off{background:var(--off)}
.sh-k{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;opacity:.9;display:flex;align-items:center;gap:8px}
.sh-k svg{width:18px;height:18px}
.sheet-body{padding:18px 20px 4px;display:flex;flex-direction:column;gap:14px}
.cartel-quote{background:var(--sign);color:#fff;border:5px solid var(--sign);box-shadow:inset 0 0 0 2px #fff;border-radius:12px;padding:14px 16px;font:800 1.2rem/1.25 var(--f-display)}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:700 1rem/1.3 var(--f-display)}
.opt.ok{border-color:var(--route);background:var(--good-bg)}
.opt.no{border-color:var(--stop);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.pts{font:900 2.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.pts.good{color:var(--sign)} .pts.bad{color:var(--stop)}
.ref{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--sign)}
.feedback{display:grid;gap:8px}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame{position:absolute;inset:18%;border:4px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.codein{width:100%;font:900 2.4rem/1 var(--f-mono);letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:14px 10px;border:3px solid var(--sign);border-radius:14px;color:var(--ink);background:var(--surface)}
.menu{display:grid;gap:10px}
.countdown{font:900 3.4rem/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--stop)}

/* Marcadores */
.mk{position:relative;width:32px;height:40px}
.mk svg{width:32px;height:40px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mk-label{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid var(--line);font:800 11.5px/1 var(--f-display);padding:4px 7px 3px;border-radius:6px;color:var(--ink)}
.mk.target svg{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* Final */
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stats3 strong{display:block;font:900 2rem/1 var(--f-display)}
.stats3 span{font-size:.82rem;color:var(--muted);line-height:1.2;display:block;margin-top:6px}

/* Líder */
.gpsline{font:700 13px var(--f-mono);padding:10px 12px;border-radius:10px;background:var(--bg);display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.dot.ok{background:var(--route)} .dot.mid{background:var(--warn)} .dot.bad{background:var(--stop)}
.lmap{height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;background:#DCE3DA}
.summary{font:700 13px var(--f-mono);color:var(--muted)}
.grp{margin-top:8px;font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.prow{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.prow.off .prow-info{opacity:.5}
.prow-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.prow-name{font:800 1.05rem/1.2 var(--f-display);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow-sign{font-size:.93rem;color:var(--muted);margin-top:3px}
.code{font:700 12px var(--f-mono);letter-spacing:.12em;border:1px solid var(--line);border-radius:5px;padding:3px 6px 2px}
.tag{font:700 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:4px 7px 3px;border-radius:4px}
.tag.good{background:var(--good-bg);color:var(--sign-dark)} .tag.trap{background:var(--bad-bg);color:#8E2219} .tag.dest{background:var(--warn);color:var(--warn-ink)}
.status{font:700 12px var(--f-mono);color:var(--muted);margin-top:5px}
.status.ok{color:var(--sign)}
.prow-act{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none;margin-top:2px}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked + span{background:var(--sign)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:disabled{cursor:default}
.qrbox{background:#fff;padding:14px;border-radius:14px;border:1px solid var(--line);align-self:center;width:min(300px,100%)}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;display:block}
.linkbox{width:100%;font:500 12px var(--f-mono);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted)}
.bigqr{position:fixed;inset:0;z-index:2500;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.bigqr .qrbox{width:min(86vw,72vh);border:0}

/* Carteles */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.carteles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cartel{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.c-top{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.cartel .board{width:100%;background:var(--sign);color:#fff;border:7px solid var(--sign);box-shadow:inset 0 0 0 3px #fff;border-radius:14px;padding:20px 16px;font:900 1.5rem/1.15 var(--f-display);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cartel .qr{width:190px}
.cartel .qr img,.cartel .qr canvas{width:100%!important;height:auto!important;display:block}
.cartel .code-big{font:900 1.9rem/1 var(--f-mono);letter-spacing:.25em}
.c-foot{font-size:.85rem;color:var(--muted)}

@media (max-width:420px){ .seg{grid-template-columns:repeat(3,1fr)} .nav-dist{font-size:1.9rem} }
@media (prefers-reduced-motion: reduce){ .mk.target svg,.sheet{animation:none} .nav-ico svg{transition:none} }
@media print{
  .noprint{display:none!important}
  body{background:#fff}
  .page{max-width:none;padding:0;gap:0}
  .carteles{display:block}
  .cartel{height:132mm;margin:0 0 5mm;border:1px dashed #999;break-inside:avoid;page-break-inside:avoid;justify-content:center}
  .cartel .board{font-size:26pt}
  .cartel .qr{width:60mm}
  @page{size:A4;margin:10mm}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(() => {
'use strict';

const RAD = d => d * Math.PI / 180;
function dist(a, b) {
  const dLat = RAD(b.lat - a.lat), dLng = RAD(b.lng - a.lng);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(RAD(a.lat)) * Math.cos(RAD(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(x));
}

  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

const Geo = {
  pos: null, err: null, watchId: null, sim: false, subs: new Set(),
  start() {
    if (this.sim || this.watchId !== null) return;
    if (!('geolocation' in navigator)) { this.err = 'nogeo'; this.emit(); return; }
    this.watchId = navigator.geolocation.watchPosition(
      p => { this.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: Date.now() }; this.err = null; this.emit(); },
      e => { this.err = e.code === 1 ? 'denied' : 'unavailable'; this.emit(); },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  },
  stop() { if (this.watchId !== null) { navigator.geolocation.clearWatch(this.watchId); this.watchId = null; } },
  setSim(lat, lng) { this.pos = { lat, lng, acc: 4, t: Date.now(), sim: true }; this.err = null; this.emit(); },
  on(f) { this.subs.add(f); return () => this.subs.delete(f); },
  emit() { this.subs.forEach(f => f(this.pos, this.err)); }
};
const Compass = {
  heading: null, listening: false,
  needsPermission() { return typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'; },
  start() {
    const listen = () => {
      if (this.listening) return; this.listening = true;
      const handler = e => {
        let h = null;
        if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
        else if (e.absolute && typeof e.alpha === 'number') h = (360 - e.alpha) % 360;
        if (h !== null) this.heading = (h + ((screen.orientation && screen.orientation.angle) || 0)) % 360;
      };
      window.addEventListener('deviceorientationabsolute', handler);
      window.addEventListener('deviceorientation', handler);
    };
    try {
      if (this.needsPermission()) DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') listen(); }).catch(() => {});
      else listen();
    } catch (e) {}
  }
};
const Sound = {
  ctx: null,
  init() { try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  tone(f, d, t = 0, type = 'sine', vol = .2) {
    const c = this.ctx; if (!c) return;
    try {
      const o = c.createOscillator(), g = c.createGain(), at = c.currentTime + t;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + d);
      o.connect(g).connect(c.destination); o.start(at); o.stop(at + d + .05);
    } catch (e) {}
  },
  good() { this.tone(660, .15); this.tone(880, .15, .14); this.tone(1175, .3, .28); },
  warn() { for (let i = 0; i < 4; i++) this.tone(i % 2 ? 660 : 880, .17, i * .22, 'square', .12); },
  bad() { this.tone(196, .55, 0, 'sawtooth', .16); this.tone(147, .6, .3, 'sawtooth', .14); },
  ping() { this.tone(988, .18); }
};

/* ================= Nube (Firebase): recorrido fijo y transmisión en vivo ================= */
const ROUTE_ID = 'capilla';
const LIVE_KEYS = ['run','name','start','score','visited','warned','fallen','avoided','pos','t','weak','trail','target','lockUntil','done','warn','ev'];
const Cloud = {
  db: undefined,
  init() {
    if (this.db !== undefined) return this.db;
    try {
      const cfg = window.FIREBASE_CONFIG;
      if (cfg && cfg.apiKey && cfg.projectId && window.firebase) {
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
        this.db = firebase.firestore(app);
      } else this.db = null;
    } catch (e) { console.error(e); this.db = null; }
    return this.db;
  },
  get ok() { return !!this.init(); },
  routeRef() { return this.init().collection('rutas').doc(ROUTE_ID); },
  liveRef() { return this.routeRef().collection('vivo').doc('actual'); },
  toCloud(g) { return { v: 1, g: g.g, p: g.p.map(r => ({ id: r[0], lat: r[1], lng: r[2], hint: r[3] || '' })), r: g.r || [WARN_R, ARRIVE_R], lim: g.lim || '', updatedAt: Date.now() }; },
  fromCloud(d) { return d && Array.isArray(d.p) ? { v: 1, g: d.g, p: d.p.map(o => [o.id, o.lat ?? null, o.lng ?? null, o.hint || '']), r: d.r, lim: d.lim || '' } : null; },
  async saveRoute(g) { await this.routeRef().set(this.toCloud(g)); },
  async loadRoute() { const s = await this.routeRef().get(); return s.exists ? this.fromCloud(s.data()) : null; },
  _last: 0, _timer: null, _data: null,
  pushLive(data, force) {
    if (!this.ok) return;
    this._data = data;
    const send = () => { this._timer = null; this._last = Date.now(); this.liveRef().set(this._data).catch(e => console.error(e)); };
    if (force || Date.now() - this._last >= 1000) { clearTimeout(this._timer); send(); }
    else if (!this._timer) this._timer = setTimeout(send, 1000 - (Date.now() - this._last));
  }
};

function gp(id) { const r = game.p.find(x => x[0] === id); return r && BY_ID[id] ? { ...BY_ID[id], lat: r[1], lng: r[2], hint: r[3] || '' } : null; }

let view = null, cleanup = [];
function setView(name, html) {
  closeSheet();

  view = name; app.innerHTML = html; window.scrollTo(0, 0);

function route() {
  const hs = location.hash.slice(1);
  if (hs.startsWith('j=')) {
    try { const g = dec(hs.slice(2)); if (!g || g.v !== 1 || !Array.isArray(g.p)) throw 0; loadGame(g, false, false); }
    catch (e) { clearHash(); return showHome('El enlace del juego está incompleto. Pídanle al líder que vuelva a mostrar el QR.'); }
    clearHash(); return showTeam();
  }
  if (hs.startsWith('jugador') || hs === 'equipos') {
    const pantalla = hs !== 'equipos';
    const raw = pantalla ? hs.slice(7).replace(/^=/, '') : '';
    clearHash();
    if (raw) {
      let g = null;
      try { g = dec(raw); if (!g || g.v !== 1 || !Array.isArray(g.p)) throw 0; }
      catch (e) { return showHome('El enlace del jugador está incompleto. Vuelve a generarlo en el modo líder.'); }
      loadGame(g, true, false); return showTeam();
    }
    const fromDevice = () => {
      const g = buildGame();
      if (!g.p.some(r => BY_ID[r[0]].type === 'good')) return showHome('No encontré el recorrido. En el modo líder, toca «Guardar recorrido en la nube» después de marcar los carteles.');
      loadGame(g, pantalla, false); showTeam();
    };
    if (!Cloud.ok) return fromDevice();
    showLoading('Cargando el recorrido…');
    Cloud.loadRoute().then(g => {
      if (g && g.p.some(r => BY_ID[r[0]] && BY_ID[r[0]].type === 'good')) { loadGame(g, pantalla, false); showTeam(); }
      else fromDevice();
    }).catch(e => { console.error(e); fromDevice(); });
    return;
  }
  if (hs === 'pantalla') { clearHash(); return showScreen(); }
  if (hs.startsWith('c=')) {
    const code = hs.slice(2); clearHash();
    if (game && loadT() && !T.done) { showTeam(); setTimeout(() => handleCode(code), 350); }
    else showHome('Primero únanse al juego con el QR del líder; después escaneen los carteles.');
    return;
  }
  if (hs === 'lider') return showLeader();
  if (hs === 'carteles') return showCarteles();
  if (view === 'team' || view === 'final' || view === 'setup' || view === 'screen' || view === 'loading') return;
  showHome();
}

}

    <p class="lead">El GPS guía a cada equipo por el predio. En el camino hay carteles que ayudan a discernir y carteles trampa que parecen buenos. Si se acercan a una trampa, el GPS avisa y tienen que desviarse. El destino es la capilla, donde se anuncia a Jesús.</p>
    ${cont ? `<button class="btn primary block" id="hCont">Continuar recorrido · ${esc(teamLabel(t))}</button>` : ''}
    <a class="btn ${cont ? '' : 'primary'} block" href="#lider">Soy líder: preparar el juego</a>
    <div class="card soft"><h3>¿Son un equipo?</h3><p>Escaneen con la cámara del celular el QR que les muestra su líder.</p></div>
  </main>`);
  const c = $('#hCont'); if (c) c.onclick = () => showTeam();
}

/* ---------- Líder ---------- */
let placing = null;
function buildGame() {
  const p = [];
  PRESETS.forEach(pr => { const s = leader.pts[pr.id]; if (s.use) p.push([pr.id, s.lat != null ? +s.lat.toFixed(6) : null, s.lng != null ? +s.lng.toFixed(6) : null, s.hint || '']); });
  return { v: 1, g: leader.g, p, r: leader.r.slice(), lim: leader.lim || '' };
}
function showLeader() {
  Geo.sim = false; if (Geo.pos && Geo.pos.sim) Geo.pos = null; Geo.start();
  placing = null;
  setView('leader', `<main class="page">
    <a class="back" href="#">← Inicio</a>
    <div><p class="kicker">Modo líder</p><h1>Preparar el recorrido</h1></div>
    <p class="lead">Para los 6 a 8 minutos del punto 1: 3 puntos buenos, la capilla y 2 o 3 trampas. Un celular por equipo.</p>

    <section class="card"><p class="stepn">Paso 1</p><h2>Imprime los carteles</h2>
      <p>Los carteles buenos y las trampas se ven iguales: los equipos tienen que leerlos y discernir antes de escanear. Se imprimen una vez y sirven siempre.</p>
      <a class="btn" href="#carteles">Ver carteles para imprimir</a></section>

    <section class="card"><p class="stepn">Paso 2</p><h2>Ubica cada cartel en el predio</h2>
      <p>Pega cada cartel, párate al lado y toca <b>Marcar aquí</b>. Bajo techo el GPS no sirve: deja el punto como <b>Solo QR</b> y escribe una pista. Pon las trampas en el camino, a unos 15 a 20 m de los puntos buenos.</p>
      <div class="gpsline" id="lGps"><span class="dot"></span><span>GPS: buscando señal…</span></div>
      <div class="gpsline field" id="lField">Prueba de campo: camina entre los carteles y aquí verás a cuántos metros estás de cada uno.</div>
      <div class="lmap" id="lmap"></div>
      <p class="summary" id="lSum"></p>
      <div id="lList"></div></section>

    <section class="card"><p class="stepn">Paso 3</p><h2>Ajusta las distancias</h2>
      <p>El GPS del celular tiene entre 5 y 15 m de error. Haz una vuelta de prueba: si el aviso de trampa salta donde no debe, bájalo; si cuesta «llegar» a un punto, súbelo. Los círculos del mapa muestran cada zona.</p>
      <label class="range"><span>Aviso de trampa <b id="rWv">${leader.r[0]} m</b></span><input type="range" id="rW" min="6" max="30" step="1" value="${leader.r[0]}"></label>
      <label class="range"><span>Llegada a un punto <b id="rAv">${leader.r[1]} m</b></span><input type="range" id="rA" min="4" max="25" step="1" value="${leader.r[1]}"></label>
      <p class="small">Recomendado: aviso de 12 a 15 m y llegada de 8 a 10 m, con los carteles separados al menos 20 m.</p></section>

    <section class="card"><p class="stepn">Paso 4</p><h2>Antes de jugar</h2>
      <label class="lbl" for="lLim">Límites del predio (lo ve el jugador antes de empezar)</label>
      <input class="input" id="lLim" maxlength="90" placeholder="Ej.: no salir del portón ni subir al primer piso" value="${esc(leader.lim)}">
      <ul class="check">
        <li>El jugador camina acompañado por un compañero que mira el camino: él va mirando el celular.</li>
        <li>Caminar, nunca correr. Cuidado con escalones, autos y puertas.</li>
        <li>Celular con batería, sonido alto y datos móviles encendidos.</li>
        <li>Haz una vuelta de prueba antes de la clase con «Probar como jugador» y otra caminando.</li>
        <li>Plan B si falla la señal o internet: <a href="../" target="_blank" rel="noopener">la presentación «El GPS y la señal perdida»</a>.</li>
      </ul></section>

    <section class="card"><p class="stepn">Paso 5</p><h2>Guarda el recorrido y usa los enlaces fijos</h2>
      <p>Guarda el recorrido una vez y los enlaces de abajo funcionan siempre, en cualquier celular o computadora. Si cambias un cartel, vuelve a guardar.</p>
      <div class="row"><button class="btn primary" id="lSave">Guardar recorrido en la nube</button></div>
      <p class="gpsline" id="lCloud"></p>
      <div id="lLinks" class="links"></div>
      <div class="row"><button class="btn" id="lTestP">Probar como jugador</button><button class="btn" id="lTest">Probar como equipo</button><span id="lLiveReset"><button class="btn small" id="lClearLive">Limpiar la pantalla grande</button></span></div>
      <details class="more"><summary>Sin conexión a la nube: enlaces largos</summary>
        <p class="small">Estos enlaces llevan el recorrido adentro, así que funcionan aunque la nube no esté conectada. La pantalla grande en vivo sí necesita la nube; sin ella, conecta el celular del jugador al proyector.</p>
        <div class="row"><button class="btn small primary" id="lPlayer">Enlace largo del jugador</button><button class="btn small" id="lShare">QR largo para equipos</button></div>
        <div id="lOutP" class="card soft" hidden></div>
        <div id="lOut" class="card soft" hidden></div>
      </details></section>

    <section class="card soft"><h3>Empezar de cero</h3><p class="small">Borra todas las ubicaciones guardadas en este celular.</p><div id="lReset"><button class="btn danger small" id="lResetBtn">Borrar ubicaciones</button></div></section>
  </main>`);

  let map = null, layer = null, me = null, meAcc = null, centered = false;
  if (window.L) {
    map = L.map('lmap', { zoomControl: true }).setView([-15, -60], 3);
    tiles(map); layer = L.layerGroup().addTo(map);
    map.on('click', e => {
      if (!placing) return;
      Object.assign(leader.pts[placing], { lat: e.latlng.lat, lng: e.latlng.lng, acc: null, use: true });
      saveLeader(); toast(`«${BY_ID[placing].name}» ubicado en el mapa`); placing = null; renderList(); draw();
    });
    cleanup.push(() => map.remove());
  } else $('#lmap').innerHTML = '<div class="map-off">El mapa necesita internet. Igual puedes marcar los puntos con el GPS.</div>';

  function draw() {
    if (!map) return;
    layer.clearLayers();
    const pts = [];
    PRESETS.forEach(p => {
      const s = leader.pts[p.id]; if (!s.use || s.lat == null) return;
      const kind = p.type === 'trap' ? 'trap' : p.type === 'dest' ? 'destL' : 'good';
      const m = L.marker([s.lat, s.lng], { icon: mkIcon(kind, p.name), draggable: true }).addTo(layer);
      m.on('dragend', ev => { const ll = ev.target.getLatLng(); Object.assign(s, { lat: ll.lat, lng: ll.lng, acc: null }); saveLeader(); renderList(); });
      L.circle([s.lat, s.lng], { radius: p.type === 'trap' ? leader.r[0] : leader.r[1], color: p.type === 'trap' ? '#C33A2E' : '#0B6B45', weight: 1, fillOpacity: .08 }).addTo(layer);
      pts.push([s.lat, s.lng]);
    });
    if (pts.length && !centered) { map.fitBounds(pts, { padding: [40, 40], maxZoom: 19 }); centered = true; }
  }
  function renderList() {
    const groups = [['good', 'Puntos buenos'], ['dest', 'Destino'], ['trap', 'Trampas']];
    $('#lList').innerHTML = groups.map(([ty, lbl]) => `<h3 class="grp">${lbl}</h3>` + PRESETS.filter(p => p.type === ty).map(p => {
      const s = leader.pts[p.id], loc = s.lat != null;
      const st = !s.use ? 'No se usa hoy' : loc ? (s.acc != null ? `Marcado con GPS · ±${s.acc} m` : 'Ubicado en el mapa') : 'Solo QR (sin GPS)';
      return `<div class="prow ${s.use ? '' : 'off'}" data-id="${p.id}">
        <div class="prow-top">
          <label class="sw" title="Usar en el juego"><input type="checkbox" data-act="use" aria-label="Usar ${esc(p.name)}" ${s.use ? 'checked' : ''} ${p.type === 'dest' ? 'disabled' : ''}><span></span></label>
          <div class="prow-info"><div class="prow-name"><span class="tag ${p.type}">${TYPE_LABEL[p.type]}</span>${esc(p.name)}<span class="code">${p.code}</span></div>
            <div class="prow-sign">«${esc(p.sign)}»</div><div class="status ${s.use && loc ? 'ok' : ''}">${st}</div></div>
        </div>
        ${s.use ? `<div class="prow-act">
            <button class="btn small primary" data-act="mark">Marcar aquí</button>
            <button class="btn small" data-act="place">${placing === p.id ? 'Toca el mapa…' : 'Ubicar en el mapa'}</button>
            ${loc ? '<button class="btn small" data-act="clear">Dejar solo QR</button>' : ''}</div>
          <input class="input" id="hint-${p.id}" data-act="hint" maxlength="60" placeholder="Pista opcional (ej.: salón del fondo)" value="${esc(s.hint)}">` : ''}
      </div>`;
    }).join('')).join('');
    const used = PRESETS.filter(p => leader.pts[p.id].use);
    const n = ty => used.filter(p => p.type === ty).length;
    $('#lSum').textContent = `Hoy se usan: ${n('good')} buenos · ${n('trap')} trampas · la capilla. Con GPS: ${used.filter(p => leader.pts[p.id].lat != null).length} de ${used.length}.`;
  }
  const list = $('#lList');
  list.addEventListener('change', e => {
    const row = e.target.closest('.prow'); if (!row || e.target.dataset.act !== 'use') return;
    leader.pts[row.dataset.id].use = e.target.checked; saveLeader(); renderList(); draw();
  });
  list.addEventListener('input', e => {
    const row = e.target.closest('.prow'); if (!row || e.target.dataset.act !== 'hint') return;
    leader.pts[row.dataset.id].hint = e.target.value; saveLeader();
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const id = b.closest('.prow').dataset.id, s = leader.pts[id];
    if (b.dataset.act === 'mark') markHere(id, b);
    if (b.dataset.act === 'place') { placing = placing === id ? null : id; if (placing) { toast('Toca el mapa donde está el cartel'); $('#lmap').scrollIntoView({ behavior: 'smooth', block: 'center' }); } renderList(); }
    if (b.dataset.act === 'clear') { Object.assign(s, { lat: null, lng: null, acc: null }); saveLeader(); renderList(); draw(); }
  });
  async function markHere(id, btn) {
    if (!Geo.pos) { toast(Geo.err === 'denied' ? 'Activa el permiso de ubicación para este sitio.' : 'Todavía no hay señal GPS. Sal a cielo abierto o usa «Ubicar en el mapa».'); return; }
    btn.disabled = true;
    const samples = [Geo.pos];
    const off = Geo.on(p => { if (p) samples.push(p); });
    for (let s = 5; s > 0; s--) { btn.textContent = `Midiendo… ${s}`; await new Promise(r => setTimeout(r, 1000)); }
    off();
    const good = samples.filter(p => p.acc <= 60 && Date.now() - p.t < 15000);
    if (!good.length) { toast('La señal es muy débil aquí. Usa «Ubicar en el mapa» o déjalo como Solo QR.'); renderList(); return; }
    let W = 0, lat = 0, lng = 0;
    good.forEach(p => { const w = 1 / Math.max(p.acc, 3) ** 2; W += w; lat += p.lat * w; lng += p.lng * w; });
    Object.assign(leader.pts[id], { lat: lat / W, lng: lng / W, acc: Math.min(...good.map(p => p.acc)), use: true });
    saveLeader(); buzz(60); toast(`«${BY_ID[id].name}» marcado`); renderList(); draw();
  }
  const offGeo = Geo.on((pos, err) => {
    const line = $('#lGps'); if (!line) return;
    let cls = '', txt = 'GPS: buscando señal…';
    if (err === 'denied') { cls = 'bad'; txt = 'GPS: sin permiso. Actívalo en la configuración del navegador.'; }
    else if (err && !pos) { cls = 'bad'; txt = 'GPS: no disponible aquí.'; }
    else if (pos) { cls = pos.acc <= 12 ? 'ok' : pos.acc <= WEAK_ACC ? 'mid' : 'bad'; txt = `GPS: precisión ±${pos.acc} m · ${pos.acc <= 12 ? 'buena' : pos.acc <= WEAK_ACC ? 'regular' : 'débil (¿bajo techo?)'}`; }
    line.innerHTML = `<span class="dot ${cls}"></span><span>${txt}</span>`;
    if (map && pos) {
      if (!me) { meAcc = L.circle([pos.lat, pos.lng], { radius: pos.acc, color: '#1F6FEB', weight: 1, fillOpacity: .1 }).addTo(map); me = L.circleMarker([pos.lat, pos.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1F6FEB', fillOpacity: 1 }).addTo(map); }
      else { me.setLatLng([pos.lat, pos.lng]); meAcc.setLatLng([pos.lat, pos.lng]).setRadius(pos.acc); }
      if (!centered) { map.setView([pos.lat, pos.lng], 19); centered = true; }
    }
    const fl = $('#lField');
    if (fl && pos) {
      const near = PRESETS.filter(p => leader.pts[p.id].use && leader.pts[p.id].lat != null)
        .map(p => ({ p, d: dist(pos, leader.pts[p.id]) })).sort((a, b) => a.d - b.d).slice(0, 2);
      if (!near.length) fl.textContent = 'Prueba de campo: marca al menos un cartel para medir distancias.';
      else fl.innerHTML = 'Prueba de campo · ' + near.map(({ p, d }) => {
        const r = p.type === 'trap' ? leader.r[0] : leader.r[1];
        const inside = d <= r;
        return `<span><b>${esc(p.name)}</b> a ${Math.round(d)} m${inside ? (p.type === 'trap' ? ' · <b class="bad">saltaría el aviso</b>' : ' · <b class="ok">zona de llegada</b>') : ''}</span>`;
      }).join(' · ');
    }
  });
  cleanup.push(offGeo);
  Geo.emit();

  const setR = (i, el, out) => { leader.r[i] = +el.value; $(out).textContent = el.value + ' m'; saveLeader(); draw(); Geo.emit(); };
  $('#rW').addEventListener('input', e => setR(0, e.target, '#rWv'));
  $('#rA').addEventListener('input', e => setR(1, e.target, '#rAv'));
  $('#lLim').addEventListener('input', e => { leader.lim = e.target.value; saveLeader(); });

  const LINKS = [
    ['jugador', 'Jugador (pantalla grande)', 'El adolescente lo abre en su celular. Juega y transmite su recorrido.'],
    ['pantalla', 'Pantalla grande', 'Ábrelo en la computadora del proyector: muestra en vivo al jugador.'],
    ['equipos', 'Equipos', 'Cada equipo lo abre en su celular (o escanea el QR).']
  ];
  function renderLinks(saved) {
    const box = $('#lLinks');
    box.innerHTML = LINKS.map(([h, t, d]) => `<div class="linkrow"><div><b>${t}</b><p class="small">${d}</p>
      <input class="linkbox" readonly value="${esc(BASE() + '#' + h)}" aria-label="Enlace ${esc(t)}"></div>
      <div class="row"><button class="btn small" data-copy="${h}">Copiar</button><button class="btn small" data-qr="${h}">QR</button></div></div>`).join('');
    box.onclick = e => {
      const c = e.target.closest('[data-copy]'), q = e.target.closest('[data-qr]');
      if (c) { const link = BASE() + '#' + c.dataset.copy; try { navigator.clipboard.writeText(link).then(() => toast('Enlace copiado'), () => toast(link)); } catch (er) { toast(link); } }
      if (q) {
        const link = BASE() + '#' + q.dataset.qr;
        const o = document.createElement('div'); o.className = 'bigqr';
        o.innerHTML = `<p class="kicker">${esc(LINKS.find(l => l[0] === q.dataset.qr)[1])}</p><div class="qrbox" id="qrBig"></div><p class="small">${esc(link)}</p><button class="btn">Cerrar</button>`;
        document.body.appendChild(o); makeQR($('#qrBig'), link, 500);
        o.querySelector('button').onclick = () => o.remove();
      }
    };
  }
  const cloudLine = $('#lCloud');
  if (!Cloud.ok) {
    cloudLine.innerHTML = '<span class="dot bad"></span><span>La nube todavía no está conectada. Mientras tanto, los enlaces fijos usan el recorrido guardado en este celular, y la pantalla grande en vivo no funciona.</span>';
    $('#lSave').disabled = true; $('#lClearLive').disabled = true;
  } else {
    cloudLine.innerHTML = '<span class="dot"></span><span>Comprobando el recorrido guardado…</span>';
    Cloud.routeRef().get().then(s => {
      const d = s.exists ? s.data() : null;
      cloudLine.innerHTML = d ? `<span class="dot ok"></span><span>Recorrido guardado en la nube el ${new Date(d.updatedAt).toLocaleString('es')}.</span>` : '<span class="dot mid"></span><span>Todavía no guardaste el recorrido en la nube.</span>';
    }).catch(() => { cloudLine.innerHTML = '<span class="dot bad"></span><span>No pude leer la nube. Revisa la conexión a internet.</span>'; });
  }
  renderLinks();
  $('#lSave').onclick = async () => {
    const g = buildGame();
    if (!g.p.some(r => BY_ID[r[0]].type === 'good')) return toast('Elige al menos un punto bueno.');
    const b = $('#lSave'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      await Cloud.saveRoute(g);
      cloudLine.innerHTML = `<span class="dot ok"></span><span>Recorrido guardado en la nube el ${new Date().toLocaleString('es')}. Los enlaces fijos ya lo usan.</span>`;
      toast('Recorrido guardado'); buzz(60);
    } catch (e) { console.error(e); toast('No se pudo guardar. Revisa internet y las reglas de Firebase.'); }
    b.disabled = false; b.textContent = 'Guardar recorrido en la nube';
  };
  $('#lClearLive').onclick = () => {
    if (!Cloud.ok) return;
    Cloud.liveRef().set({ run: 0, t: Date.now() }).then(() => toast('Pantalla grande en espera'), () => toast('No se pudo limpiar la pantalla'));
  };

  $('#lShare').onclick = () => {
    const g = buildGame();
    if (!g.p.some(r => BY_ID[r[0]].type === 'good')) return toast('Elige al menos un punto bueno.');
    const link = BASE() + '#j=' + enc(g);
    const noGps = g.p.filter(r => r[1] == null).length;
    const out = $('#lOut'); out.hidden = false;
    out.innerHTML = `<div class="qrbox" id="qrJoin"></div>
      <p class="small center">Cada equipo escanea este QR con la cámara de su celular.</p>
      ${noGps ? `<p class="small center">${noGps} punto${noGps > 1 ? 's' : ''} sin GPS: funcionan solo escaneando el cartel.</p>` : ''}
      <div class="row" style="justify-content:center"><button class="btn small primary" id="bigQ">Mostrar QR grande</button><button class="btn small" id="copyL">Copiar enlace</button></div>
      <input class="linkbox" id="linkBox" readonly value="${esc(link)}" aria-label="Enlace del juego">`;
    makeQR($('#qrJoin'), link, 300, true);
    $('#copyL').onclick = () => {
      const fb = () => { const i = $('#linkBox'); i.focus(); i.select(); toast('Enlace seleccionado: cópialo'); };
      try { navigator.clipboard.writeText(link).then(() => toast('Enlace copiado'), fb); } catch (e) { fb(); }
    };
    $('#bigQ').onclick = () => {
      const o = document.createElement('div'); o.className = 'bigqr';
      o.innerHTML = '<p class="kicker">Ruta a la capilla · escanea para unirte</p><div class="qrbox" id="qrBig"></div><button class="btn">Cerrar</button>';
      document.body.appendChild(o); makeQR($('#qrBig'), link, 600, true);
      o.querySelector('button').onclick = () => o.remove();
    };
  };
  const tryGame = (pantalla) => {
    const g = buildGame();
    if (!g.p.some(r => BY_ID[r[0]].type === 'good')) { toast('Elige al menos un punto bueno.'); return; }
    loadGame(g, pantalla, true); store.del('gpsgo-team-' + g.g);
    if (location.hash) location.hash = '';
    showTeam();
  };
  $('#lTest').onclick = () => tryGame(false);
  $('#lTestP').onclick = () => tryGame(true);
  $('#lPlayer').onclick = () => {
    const g = buildGame();
    if (!g.p.some(r => BY_ID[r[0]].type === 'good')) return toast('Elige al menos un punto bueno.');
    const link = BASE() + '#jugador=' + enc(g);
    const out = $('#lOutP'); out.hidden = false;
    out.innerHTML = `<p><b>Enlace del jugador</b>: ábrelo en el celular que se va a ver en la pantalla grande. Puedes escanear este QR con ese celular o enviarle el enlace.</p>
      <div class="qrbox" id="qrPlayer"></div>
      <div class="row" style="justify-content:center"><button class="btn small primary" id="copyP">Copiar enlace del jugador</button><button class="btn small" id="openP">Abrir aquí</button></div>
      <input class="linkbox" id="linkP" readonly value="${esc(link)}" aria-label="Enlace del jugador">
      <p class="small">Si preparaste el recorrido en ese mismo celular, también sirve el enlace corto: <b>${esc(BASE())}#jugador</b></p>`;
    makeQR($('#qrPlayer'), link, 300, true);
    $('#copyP').onclick = () => {
      const fb = () => { const i = $('#linkP'); i.focus(); i.select(); toast('Enlace seleccionado: cópialo'); };
      try { navigator.clipboard.writeText(link).then(() => toast('Enlace del jugador copiado'), fb); } catch (e) { fb(); }
    };
    $('#openP').onclick = () => { loadGame(g, true, false); location.hash = ''; showTeam(); };
  };
  $('#lResetBtn').onclick = () => {
    $('#lReset').innerHTML = '<p><b>¿Seguro?</b> Se borran todas las ubicaciones y pistas.</p><div class="row"><button class="btn danger small" id="rYes">Sí, borrar</button><button class="btn small" id="rNo">Cancelar</button></div>';
    $('#rNo').onclick = () => showLeader();
    $('#rYes').onclick = () => { leader = freshLeader(); saveLeader(); toast('Ubicaciones borradas'); showLeader(); };
  };
  renderList(); draw();
}

    <div class="carteles">${PRESETS.map(p => `<article class="cartel">
      <div class="c-top">GO · Ruta a la capilla</div>
      <div class="board">${esc(p.sign)}</div>
      <div class="qr" data-code="${p.code}"></div>

/* ---------- Equipo ---------- */
function showTeam() {
  if (!game) return showHome('Todavía no hay un juego cargado en este celular.');

let sheetEl = null;
function openSheet(html, onClose) {

  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<div class="sheet${view === 'team' && T && T.pantalla ? ' big' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(w); sheetEl = w; w._onClose = onClose;
  return w;
}
function closeSheet() { if (sheetEl) { const f = sheetEl._onClose; sheetEl.remove(); sheetEl = null; if (f) f(); } }
const sheetOpen = () => !!sheetEl;
function sheetMsg(title, text, tone = 'off') {

  w.querySelector('button').onclick = closeSheet;
}

let updateGame = () => {};
function showGame() {
  const sim = isSim();
  if (sim) { Geo.stop(); Geo.sim = true; } else { Geo.sim = false; if (Geo.pos && Geo.pos.sim) Geo.pos = null; Geo.start(); }
  const pantalla = !!T.pantalla;
  T.trail = T.trail || [];
  setView('team', `<div class="tv${pantalla ? ' pantalla' : ''}">
    <header class="nav" id="nav" data-tone="off" aria-live="polite">
      <div class="nav-ico" id="navIco"></div>
      <div style="min-width:0"><div class="nav-dist" id="navDist"></div><div class="nav-text" id="navText">Buscando señal…</div><span class="nav-chip" id="navChip" hidden></span></div>
    </header>
    <div class="tv-map"><div id="tmap"></div>${pantalla ? `<div class="live-badge">EN VIVO · ${esc(teamLabel(T)).toUpperCase()}</div>` : ''}${sim ? '<div class="sim">MODO PRUEBA · toca el mapa para moverte</div>' : ''}</div>
    <aside class="side">
      <p class="kicker">${pantalla ? 'En vivo' : 'Recorrido'} · ${esc(teamLabel(T))}</p>
      <h2 id="sideNext">Buscando señal…</h2>
      <ul class="legend">
        <li>${pin('#0B6B45', PIN_IN.dot)}<span>Próximo punto</span></li>
        <li>${pin('#7B8A82', PIN_IN.check)}<span>Punto visitado</span></li>
        <li>${pin('#C33A2E', PIN_IN.bang)}<span>Trampa detectada</span></li>
        <li>${pin('#B07A00', PIN_IN.flag)}<span>La capilla</span></li>
        <li><span class="me"></span><span>${pantalla ? 'Jugador' : 'Tu equipo'}</span></li>
        <li><span class="trail"></span><span>Camino recorrido</span></li>
      </ul>
      <p class="small">El Espíritu guía a sus hijos y les enseña a discernir juntos.</p>
    </aside>
    <footer class="bar">
      <div class="stat"><span>Puntos</span><strong id="sScore">0</strong></div>
      <div class="stat"><span>Ruta</span><strong id="sProg">0/0</strong></div>
      <div class="stat"><span>Tiempo</span><strong id="sTime">0:00</strong></div>
      <button class="icon-btn" id="menuBtn" aria-label="Más opciones">${ICON.menu}</button>
      <div class="bar-actions"><button class="btn primary scan-btn" id="scanBtn">${ICON.scan.replace('<svg', '<svg width="22" height="22"')} Escanear cartel</button><button class="btn" id="codeBtn">Código</button></div>
    </footer>
  </div>`);

  let map = null, me = null, meAcc = null, marks = {}, fitted = false, trailLine = null, trailCase = null;
  if (window.L) {
    map = L.map('tmap', { zoomControl: false });
    tiles(map);
    const pts = game.p.filter(r => r[1] != null).map(r => [r[1], r[2]]);
    if (pts.length) { map.fitBounds(pts, { padding: [50, 50], maxZoom: 19 }); fitted = true; } else map.setView([-15, -60], 3);
    if (sim) {
      if (!Geo.pos || !Geo.pos.sim) {
        const c = pts.length ? pts.reduce((a, p) => [a[0] + p[0] / pts.length, a[1] + p[1] / pts.length], [0, 0]) : null;
        if (c) Geo.setSim(c[0] - 0.00035, c[1]);
      }
      map.on('click', e => Geo.setSim(e.latlng.lat, e.latlng.lng));
      window.irA = (lat, lng) => Geo.setSim(lat, lng);
    }
    trailCase = L.polyline(T.trail, { color: '#ffffff', weight: 11, opacity: .9, interactive: false }).addTo(map);
    trailLine = L.polyline(T.trail, { color: '#0B6B45', weight: 6, opacity: .95, interactive: false }).addTo(map);
    cleanup.push(() => map.remove());
  } else $('#tmap').innerHTML = '<div class="map-off">Sin internet no se ve el mapa, pero el GPS y los carteles siguen funcionando.</div>';

  function drawMarks(tgt) {
    if (!map) return;
    game.p.forEach(r => {
      const p = gp(r[0]); if (!p || p.lat == null) return;
      let kind = null, label = '';
      if (p.type === 'trap') { if (T.warned[p.id] || T.fallen[p.id] || T.avoided[p.id]) { kind = 'trap'; label = 'Trampa'; } }
      else if (T.visited[p.id]) kind = 'visited';
      else if (tgt && tgt.id === p.id) { kind = p.type === 'dest' ? 'dest' : 'target'; label = p.type === 'dest' ? 'Capilla' : 'Próximo'; }
      const key = kind + label;
      const m = marks[p.id];
      if (!kind) { if (m) { m.remove(); delete marks[p.id]; } return; }
      if (m && m._key === key) return;
      if (m) m.remove();
      const nm = L.marker([p.lat, p.lng], { icon: mkIcon(kind, label), interactive: false, keyboard: false }).addTo(map);
      nm._key = key; marks[p.id] = nm;

  }

  let lastRot = null, lastD = null, lastTgt = null, trend = '';
  function nav(tone, icon, distTxt, text, chip, rot) {
    const n = $('#nav'); if (!n) return;
    n.dataset.tone = tone;
    const ic = $('#navIco');
    if (ic.dataset.icon !== icon) { ic.innerHTML = ICON[icon]; ic.dataset.icon = icon; lastRot = null; }
    const svg = ic.firstElementChild;
    if (svg) {
      if (rot != null) { let r = rot; if (lastRot != null) { while (r - lastRot > 180) r -= 360; while (r - lastRot < -180) r += 360; } lastRot = r; svg.style.transform = `rotate(${r}deg)`; }
      else svg.style.transform = icon === 'spin' ? '' : '';
      svg.classList.toggle('spinning', icon === 'spin');
    }
    const d = $('#navDist'); d.textContent = distTxt || ''; d.hidden = !distTxt;
    $('#navText').textContent = text;
    const c = $('#navChip'); c.textContent = chip || ''; c.hidden = !chip;
  }

  updateGame = function update() {
    if (view !== 'team' || !T) return;
    const now = Date.now(), pos = Geo.pos;
    const weak = !pos || pos.acc > WEAK_ACC || now - pos.t > 30000;
    $('#sScore').textContent = T.score;
    $('#sProg').textContent = `${Object.keys(T.visited).length}/${totalStops()}`;
    $('#sTime').textContent = fmtTime(now - T.start);

    if (map && pos) {
      const ll = [pos.lat, pos.lng];
      if (!me) {
        meAcc = L.circle(ll, { radius: pos.acc, color: '#1F6FEB', weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
        me = L.circleMarker(ll, { radius: 9, color: '#fff', weight: 3, fillColor: '#1F6FEB', fillOpacity: 1, interactive: false }).addTo(map);
        if (!fitted) { map.setView(ll, 19); fitted = true; }
        else if (!map.getBounds().contains(ll)) map.fitBounds(L.latLngBounds([ll]).extend(map.getBounds()), { padding: [40, 40], maxZoom: 19 });
      } else { me.setLatLng(ll); meAcc.setLatLng(ll).setRadius(pos.acc); if (!map.getBounds().pad(pantalla ? -0.3 : -0.15).contains(ll)) map.panTo(ll); }
    }
    if (pos && !weak) {
      const tr = T.trail, last = tr[tr.length - 1];
      if (!last || dist({ lat: last[0], lng: last[1] }, pos) >= 3) {
        tr.push([+pos.lat.toFixed(6), +pos.lng.toFixed(6)]);
        if (tr.length > 800) tr.splice(0, tr.length - 800);
        saveT();
        if (trailLine) { trailLine.setLatLngs(tr); trailCase.setLatLngs(tr); }
      }
    }
    publishLive(false);

    if (pos && !weak && !sheetOpen() && now >= T.lockUntil) {
      for (const t of traps()) {
        if (t.lat == null || T.warned[t.id] || T.fallen[t.id]) continue;
        const d = dist(pos, t);
        if (d <= WR()) { T.warned[t.id] = now; saveT(); openWarn(t, Math.max(1, Math.round(d))); break; }
      }
    }

    const tgt = target();
    drawMarks(tgt);
    const sn = $('#sideNext');
    if (sn) sn.textContent = activeWarn ? 'Trampa a la vista: ¿qué le responderían?' : now < T.lockUntil ? 'Recalculando después de una trampa' : !tgt ? 'Recorrido completo' : tgt.type === 'dest' ? 'Rumbo a la capilla' : `Rumbo al punto ${goodsDone() + 1} de ${goods().length}`;
    if (activeWarn) return nav('stop', 'warn', 'Peligro', `Trampa a ${activeWarn.d} m: lean el aviso y desvíen`, 'Recalculando');
    if (now < T.lockUntil) return nav('warn', 'spin', Math.ceil((T.lockUntil - now) / 1000) + ' s', 'Recalculando… cayeron en una trampa', 'Esperen y sigan la ruta');
    if (!tgt) return nav('go', 'flag', '', 'Recorrido completo');
    const label = tgt.type === 'dest' ? 'Destino final: la capilla' : `Punto ${goodsDone() + 1} de ${goods().length}`;
    if (tgt.lat == null) return nav('off', 'qr', 'Bajo techo', `${label}${tgt.hint ? ' · ' + tgt.hint : ''}`, 'Busquen el cartel y escanéenlo');
    if (weak) {
      const denied = Geo.err === 'denied';
      return nav('off', 'nosig', denied ? 'Sin permiso' : 'Sin señal', `${label}${tgt.hint ? ' · ' + tgt.hint : ''}`, denied ? 'Activen la ubicación del navegador' : 'Sigan por la ruta y busquen el cartel');
    }
    const d = dist(pos, tgt), b = bearing(pos, tgt), h = Compass.heading;
    if (lastTgt === tgt.id && lastD != null) { if (d < lastD - 2) trend = 'Más cerca'; else if (d > lastD + 2) trend = 'Más lejos'; }
    else trend = '';
    if (lastTgt !== tgt.id || Math.abs(d - lastD) > 2) { lastD = d; lastTgt = tgt.id; }
    if (d <= AR()) {
      if (!T.arrived[tgt.id]) { T.arrived[tgt.id] = now; saveT(); Sound.ping(); buzz(90); }
      return nav('go', 'flag', 'Llegaron', `${label} · busquen el cartel y escanéenlo`, 'Están en la zona');
    }
    nav('go', 'arrow', fmtDist(d), label + (tgt.hint ? ' · ' + tgt.hint : ''), trend || (h != null ? 'Brújula activa' : 'Flecha = norte del mapa'), h != null ? b - h : b);
  };

  const offGeo = Geo.on(() => updateGame());
  const iv = setInterval(() => updateGame(), 1000);
  cleanup.push(offGeo, () => clearInterval(iv), () => { updateGame = () => {}; });
  $('#scanBtn').onclick = openScanner;
  $('#codeBtn').onclick = openCode;
  $('#menuBtn').onclick = openMenu;
  if (!sim) keepAwake();
