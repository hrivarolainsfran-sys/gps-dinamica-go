<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6B45">
<title>Ruta a la capilla</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass+Mono:wght@500;700&family=Overpass:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Juego al aire libre: un solo tema claro a propósito, para leer bajo el sol. Lenguaje visual de cartel vial verde. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --ink:#13201A; --muted:#4D5C54; --line:#CBD5CD;
  --sign:#0B6B45; --sign-dark:#08502F; --route:#16A36B;
  --warn:#F3B41C; --warn-ink:#2B1F00; --stop:#C33A2E; --off:#5C6963;
  --good-bg:#DDF1E6; --bad-bg:#FBE3E0;
  --f-display:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-weight:900;font-size:clamp(2rem,1.5rem + 2.5vw,2.8rem);letter-spacing:-.01em}
h2{font-weight:800;font-size:1.35rem}
h3{font-weight:800;font-size:1.05rem}
p{margin:0}
.kicker{font:700 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--sign)}
.kicker.light{color:#fff;opacity:.85}
.small{font-size:.88rem;color:var(--muted)}
.lead{font-size:1.08rem}
.center{text-align:center}
.page{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 36px) max(16px,env(safe-area-inset-left,0px))}
.page.wide{max-width:1100px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:800 1rem/1 var(--f-display);padding:.95em 1.3em .9em;border-radius:999px;border:2px solid var(--ink);background:transparent;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.small{font-size:.86rem;padding:.65em 1em .6em}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.back{font:700 13px var(--f-mono);color:var(--sign);text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:transparent;border-style:dashed}
.notice{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-weight:700}
.stepn{font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* Cartel vial (hero) */
.hero-sign{background:var(--sign);color:#fff;border:7px solid var(--sign);box-shadow:inset 0 0 0 3px #fff;border-radius:18px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:8px}
.hero-sign p:last-child{font:700 1.05rem/1.3 var(--f-display);opacity:.95}
.hero-arrow{width:44px;height:44px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Equipo: preparación */
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font:900 1.3rem/1 var(--f-display)}
.seg button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:#fff}
label.lbl{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.input{width:100%;font:700 1.05rem var(--f-body);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.rules b{font:900 1.05rem var(--f-display);text-align:center;border-radius:8px;padding:6px 0 4px}
.rules .p{background:var(--good-bg);color:var(--sign-dark)} .rules .n{background:var(--bad-bg);color:#8E2219}

/* Equipo: recorrido */
.tv{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}
.nav{background:var(--sign);color:#fff;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;z-index:500;transition:background-color .3s,color .3s;box-shadow:0 6px 18px -10px rgba(0,0,0,.55);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.nav[data-tone="warn"]{background:var(--warn);color:var(--warn-ink)}
.nav[data-tone="stop"]{background:var(--stop)}
.nav[data-tone="off"]{background:var(--off)}
.nav-ico{width:64px;height:64px;display:grid;place-items:center}
.nav-ico svg{width:56px;height:56px;transition:transform .45s ease}
.nav-ico svg.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-dist{font:900 2.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.nav-text{font:700 1.02rem/1.25 var(--f-display);margin-top:3px}
.nav-chip{display:inline-block;font:700 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;background:rgba(255,255,255,.2);padding:5px 8px 4px;border-radius:5px;margin-top:7px}
.nav[data-tone="warn"] .nav-chip{background:rgba(0,0,0,.1)}
.tv-map{position:relative;min-height:0;background:#DCE3DA}
#tmap{position:absolute;inset:0}
.map-off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-weight:700}
.sim{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:var(--ink);color:#fff;font:700 11px var(--f-mono);padding:7px 11px;border-radius:999px;letter-spacing:.05em;white-space:nowrap}
.bar{background:var(--surface);border-top:1px solid var(--line);z-index:500;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px 12px;align-items:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.stat span{display:block;font:700 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat strong{font:800 1.4rem/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.icon-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.bar-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px}
.scan-btn{font-size:1.1rem;padding:1em 1.2em .95em}

/* Hojas */
.sheet-wrap{position:fixed;inset:0;z-index:1500;background:rgba(10,20,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:94%;overflow:auto;animation:up .3s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-head{padding:20px 20px 18px;background:var(--sign);color:#fff;border-radius:22px 22px 0 0;display:grid;gap:6px}
.sheet-head.stop{background:var(--stop)} .sheet-head.warn{background:var(--warn);color:var(--warn-ink)} .sheet-head.off{background:var(--off)}
.sh-k{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;opacity:.9;display:flex;align-items:center;gap:8px}
.sh-k svg{width:18px;height:18px}
.sheet-body{padding:18px 20px 4px;display:flex;flex-direction:column;gap:14px}
.cartel-quote{background:var(--sign);color:#fff;border:5px solid var(--sign);box-shadow:inset 0 0 0 2px #fff;border-radius:12px;padding:14px 16px;font:800 1.2rem/1.25 var(--f-display)}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:700 1rem/1.3 var(--f-display)}
.opt.ok{border-color:var(--route);background:var(--good-bg)}
.opt.no{border-color:var(--stop);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.pts{font:900 2.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.pts.good{color:var(--sign)} .pts.bad{color:var(--stop)}
.ref{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--sign)}
.feedback{display:grid;gap:8px}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame{position:absolute;inset:18%;border:4px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.codein{width:100%;font:900 2.4rem/1 var(--f-mono);letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:14px 10px;border:3px solid var(--sign);border-radius:14px;color:var(--ink);background:var(--surface)}
.menu{display:grid;gap:10px}
.countdown{font:900 3.4rem/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--stop)}

/* Marcadores */
.mk{position:relative;width:32px;height:40px}
.mk svg{width:32px;height:40px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mk-label{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid var(--line);font:800 11.5px/1 var(--f-display);padding:4px 7px 3px;border-radius:6px;color:var(--ink)}
.mk.target svg{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* Final */
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stats3 strong{display:block;font:900 2rem/1 var(--f-display)}
.stats3 span{font-size:.82rem;color:var(--muted);line-height:1.2;display:block;margin-top:6px}

/* Líder */
.gpsline{font:700 13px var(--f-mono);padding:10px 12px;border-radius:10px;background:var(--bg);display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.dot.ok{background:var(--route)} .dot.mid{background:var(--warn)} .dot.bad{background:var(--stop)}
.lmap{height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;background:#DCE3DA}
.summary{font:700 13px var(--f-mono);color:var(--muted)}
.grp{margin-top:8px;font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.prow{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.prow.off .prow-info{opacity:.5}
.prow-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.prow-name{font:800 1.05rem/1.2 var(--f-display);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow-sign{font-size:.93rem;color:var(--muted);margin-top:3px}
.code{font:700 12px var(--f-mono);letter-spacing:.12em;border:1px solid var(--line);border-radius:5px;padding:3px 6px 2px}
.tag{font:700 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:4px 7px 3px;border-radius:4px}
.tag.good{background:var(--good-bg);color:var(--sign-dark)} .tag.trap{background:var(--bad-bg);color:#8E2219} .tag.dest{background:var(--warn);color:var(--warn-ink)}
.status{font:700 12px var(--f-mono);color:var(--muted);margin-top:5px}
.status.ok{color:var(--sign)}
.prow-act{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none;margin-top:2px}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked + span{background:var(--sign)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:disabled{cursor:default}
.qrbox{background:#fff;padding:14px;border-radius:14px;border:1px solid var(--line);align-self:center;width:min(300px,100%)}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;display:block}
.linkbox{width:100%;font:500 12px var(--f-mono);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted)}
.bigqr{position:fixed;inset:0;z-index:2500;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.bigqr .qrbox{width:min(86vw,72vh);border:0}

/* Carteles */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.carteles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cartel{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.c-top{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.cartel .board{width:100%;background:var(--sign);color:#fff;border:7px solid var(--sign);box-shadow:inset 0 0 0 3px #fff;border-radius:14px;padding:20px 16px;font:900 1.5rem/1.15 var(--f-display);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cartel .qr{width:190px}
.cartel .qr img,.cartel .qr canvas{width:100%!important;height:auto!important;display:block}
.cartel .code-big{font:900 1.9rem/1 var(--f-mono);letter-spacing:.25em}
.c-foot{font-size:.85rem;color:var(--muted)}

@media (max-width:420px){ .seg{grid-template-columns:repeat(3,1fr)} .nav-dist{font-size:1.9rem} }
@media (prefers-reduced-motion: reduce){ .mk.target svg,.sheet{animation:none} .nav-ico svg{transition:none} }
@media print{
  .noprint{display:none!important}
  body{background:#fff}
  .page{max-width:none;padding:0;gap:0}
  .carteles{display:block}
  .cartel{height:132mm;margin:0 0 5mm;border:1px dashed #999;break-inside:avoid;page-break-inside:avoid;justify-content:center}
  .cartel .board{font-size:26pt}
  .cartel .qr{width:60mm}
  @page{size:A4;margin:10mm}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
'use strict';

/* ================= Contenido (Lección 6, punto 1) ================= */
const PRESETS = [
  { id:'adora', type:'good', code:'K4R', name:'Adoración', sign:'Adora con tu iglesia', ref:'Hechos 13:2',
    title:'Mientras adoraban, el Espíritu habló',
    body:'En Antioquía, el Espíritu Santo habló mientras la iglesia adoraba al Señor y ayunaba. La adoración junto a tu iglesia es un lugar donde Dios guía a los suyos.' },
  { id:'ora', type:'good', code:'M7T', name:'Oración', sign:'Ora antes de decidir', ref:'Hechos 13:3',
    title:'No salieron corriendo',
    body:'Después de escuchar al Espíritu, la iglesia volvió a orar y ayunar antes de enviar a Bernabé y a Saulo. Entre la voz del Espíritu y la obediencia hay oración.' },
  { id:'palabra', type:'good', code:'P2L', name:'La Palabra', sign:'Revisa todo con la Palabra', ref:'Recuerda la lección 2',
    title:'Se examina con la Biblia',
    body:'Lo que creemos recibir del Espíritu se examina a la luz de la Palabra y del carácter de Jesús. El Espíritu nunca contradice lo que Dios ya dijo.' },
  { id:'juntos', type:'good', code:'J9N', name:'Comunidad', sign:'Cuéntalo a alguien que ama a Jesús', ref:'Hechos 13:3',
    title:'Discernir juntos',
    body:'El Espíritu le habló a la iglesia, y la iglesia les impuso las manos a Bernabé y a Saulo y los envió. Tu líder, tus papás y creyentes maduros te ayudan a discernir, aunque no deciden por ti.' },
  { id:'paso', type:'good', code:'S5P', name:'El próximo paso', sign:'Obedece lo que Jesús ya dijo', ref:'Mateo 28:19',
    title:'Un paso a la vez',
    body:'Jesús ya dijo mucho: haz discípulos, ama a tu prójimo, sirve. Para eso no necesitas una voz especial: necesitas dar el próximo paso donde estás.' },
  { id:'capilla', type:'dest', code:'C7A', name:'La capilla', sign:'Destino: donde se anuncia a Jesús', ref:'Hechos 13:4-5',
    title:'Llegaron al destino',
    body:'Bernabé y Saulo fueron enviados por el Espíritu Santo, y lo primero que hicieron fue anunciar la palabra de Dios. Todo el recorrido termina en Jesús anunciado.' },
  { id:'senal', type:'trap', code:'X3S', name:'La señal gigante', sign:'No te muevas hasta que Dios te muestre todo tu futuro',
    why:'Lucas no presenta Hechos 13 como una receta. Muchas cosas Jesús ya las dijo: obedécelas donde estás mientras esperas.',
    q:'¿Qué hace falta para dar el próximo paso?', options:['Una señal gigante del cielo','Obedecer lo que Jesús ya dijo','Quedarse quieto hasta estar seguro'], ok:1 },
  { id:'secreto', type:'trap', code:'R8D', name:'El llanero solitario', sign:'Si Dios te habló, no se lo cuentes a nadie',
    why:'En Antioquía el Espíritu le habló a la comunidad y la comunidad confirmó. Lo que crees recibir se conversa con creyentes que te conocen.',
    q:'¿Con quién conviene conversarlo?', options:['Con nadie: es entre Dios y yo','Con mi líder, mis papás o creyentes maduros','Con quien me dé la razón'], ok:1 },
  { id:'ganas', type:'trap', code:'V6G', name:'Solo mis ganas', sign:'Si lo sientes fuerte, seguro es Dios',
    why:'Una impresión interior no es automáticamente la voz de Dios. Se examina con la Palabra, con el carácter de Jesús y con la ayuda de creyentes maduros.',
    q:'¿Cómo se examina lo que sientes?', options:['Si es muy fuerte, es Dios','Con la Palabra, el carácter de Jesús y otros creyentes','Con lo que digan las redes'], ok:1 },
  { id:'miedo', type:'trap', code:'W2M', name:'Sin vuelta atrás', sign:'Si te equivocaste de camino, Dios ya no te guía',
    why:'El GPS recalcula. Si buscaste a Dios y aun así elegiste mal, el Espíritu no te abandona: te sigue guiando desde donde estás.',
    q:'¿Qué pasa si te equivocas de camino?', options:['Dios me deja solo','Vuelvo a buscarlo y Él me sigue guiando','Mejor no decidir nunca nada'], ok:1 },
  { id:'fama', type:'trap', code:'Z4F', name:'Ser famoso', sign:'Si Dios te usa, todos van a hablar de ti',
    why:'El Espíritu no te hace importante: te capacita para anunciar a Jesús. Todo termina en Cristo anunciado.',
    q:'¿Hacia dónde lleva siempre el Espíritu?', options:['Hacia que yo sea conocido','Hacia Jesús anunciado','Hacia lo más emocionante'], ok:1 }
];
const BY_ID = Object.fromEntries(PRESETS.map(p => [p.id, p]));
const BY_CODE = Object.fromEntries(PRESETS.map(p => [p.code, p]));
const TYPE_LABEL = { good:'Bueno', trap:'Trampa', dest:'Destino' };
const DEFAULT_USE = ['adora','palabra','juntos','capilla','senal','ganas','secreto'];
const WARN_R = 15, ARRIVE_R = 10, WEAK_ACC = 35, LOCK_MS = 15000;

/* ================= Utilidades ================= */
const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const ss = {

    else if (pos) { cls = pos.acc <= 12 ? 'ok' : pos.acc <= WEAK_ACC ? 'mid' : 'bad'; txt = `GPS: precisión ±${pos.acc} m · ${pos.acc <= 12 ? 'buena' : pos.acc <= WEAK_ACC ? 'regular' : 'débil (¿bajo techo?)'}`; }
    line.innerHTML = `<span class="dot ${cls}"></span><span>${txt}</span>`;
    if (map && pos) {
      if (!me) { meAcc = L.circle([pos.lat, pos.lng], { radius: pos.acc, color: '#1F6FEB', weight: 1, fillOpacity: .1 }).addTo(map); me = L.circleMarker([pos.lat, pos.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1F6FEB', fillOpacity: 1 }).addTo(map); }

  $('#lShare').onclick = () => {

      <input class="linkbox" id="linkBox" readonly value="${esc(link)}" aria-label="Enlace del juego">`;

  $('#lTest').onclick = () => {

    game = g; store.set('gpsgo-game', g); store.del('gpsgo-team-' + g.g); ss.set('gpsgo-sim', g.g);

  $('#lResetBtn').onclick = () => {
    $('#lReset').innerHTML = '<p><b>¿Seguro?</b> Se borran todas las ubicaciones y pistas.</p><div class="row"><button class="btn danger small" id="rYes">Sí, borrar</button><button class="btn small" id="rNo">Cancelar</button></div>';

}

let sheetEl = null;

}

const sheetOpen = () => !!sheetEl;

let updateGame = () => {};
function showGame() {
  const sim = isSim();
  if (sim) { Geo.stop(); Geo.sim = true; } else { Geo.sim = false; if (Geo.pos && Geo.pos.sim) Geo.pos = null; Geo.start(); }
  setView('team', `<div class="tv">
    <header class="nav" id="nav" data-tone="off" aria-live="polite">
      <div class="nav-ico" id="navIco"></div>
      <div style="min-width:0"><div class="nav-dist" id="navDist"></div><div class="nav-text" id="navText">Buscando señal…</div><span class="nav-chip" id="navChip" hidden></span></div>
    </header>
    <div class="tv-map"><div id="tmap"></div>${sim ? '<div class="sim">MODO PRUEBA · toca el mapa para moverte</div>' : ''}</div>
    <footer class="bar">
      <div class="stat"><span>Puntos</span><strong id="sScore">0</strong></div>
      <div class="stat"><span>Ruta</span><strong id="sProg">0/0</strong></div>
      <div class="stat"><span>Tiempo</span><strong id="sTime">0:00</strong></div>
      <button class="icon-btn" id="menuBtn" aria-label="Más opciones">${ICON.menu}</button>
      <div class="bar-actions"><button class="btn primary scan-btn" id="scanBtn">${ICON.scan.replace('<svg', '<svg width="22" height="22"')} Escanear cartel</button><button class="btn" id="codeBtn">Código</button></div>
    </footer>
  </div>`);

  let map = null, me = null, meAcc = null, marks = {}, fitted = false;
  if (window.L) {
    map = L.map('tmap', { zoomControl: false });
    tiles(map);
    const pts = game.p.filter(r => r[1] != null).map(r => [r[1], r[2]]);
    if (pts.length) { map.fitBounds(pts, { padding: [50, 50], maxZoom: 19 }); fitted = true; } else map.setView([-15, -60], 3);
    if (sim) {
      if (!Geo.pos || !Geo.pos.sim) {
        const c = pts.length ? pts.reduce((a, p) => [a[0] + p[0] / pts.length, a[1] + p[1] / pts.length], [0, 0]) : null;
        if (c) Geo.setSim(c[0] - 0.00035, c[1]);
      }
      map.on('click', e => Geo.setSim(e.latlng.lat, e.latlng.lng));
      window.irA = (lat, lng) => Geo.setSim(lat, lng);
    }
    cleanup.push(() => map.remove());
  } else $('#tmap').innerHTML = '<div class="map-off">Sin internet no se ve el mapa, pero el GPS y los carteles siguen funcionando.</div>';

  function drawMarks(tgt) {
    if (!map) return;
    game.p.forEach(r => {
      const p = gp(r[0]); if (!p || p.lat == null) return;
      let kind = null, label = '';
      if (p.type === 'trap') { if (T.warned[p.id] || T.fallen[p.id] || T.avoided[p.id]) { kind = 'trap'; label = 'Trampa'; } }
      else if (T.visited[p.id]) kind = 'visited';
      else if (tgt && tgt.id === p.id) { kind = p.type === 'dest' ? 'dest' : 'target'; label = p.type === 'dest' ? 'Capilla' : 'Próximo'; }
      const key = kind + label;
      const m = marks[p.id];
      if (!kind) { if (m) { m.remove(); delete marks[p.id]; } return; }
      if (m && m._key === key) return;
      if (m) m.remove();
      const nm = L.marker([p.lat, p.lng], { icon: mkIcon(kind, label), interactive: false, keyboard: false }).addTo(map);
      nm._key = key; marks[p.id] = nm;
    });
  }

  let lastRot = null, lastD = null, lastTgt = null, trend = '';
  function nav(tone, icon, distTxt, text, chip, rot) {
    const n = $('#nav'); if (!n) return;
    n.dataset.tone = tone;
    const ic = $('#navIco');
    if (ic.dataset.icon !== icon) { ic.innerHTML = ICON[icon]; ic.dataset.icon = icon; lastRot = null; }
    const svg = ic.firstElementChild;
    if (svg) {
      if (rot != null) { let r = rot; if (lastRot != null) { while (r - lastRot > 180) r -= 360; while (r - lastRot < -180) r += 360; } lastRot = r; svg.style.transform = `rotate(${r}deg)`; }
      else svg.style.transform = icon === 'spin' ? '' : '';
      svg.classList.toggle('spinning', icon === 'spin');
    }
    const d = $('#navDist'); d.textContent = distTxt || ''; d.hidden = !distTxt;
    $('#navText').textContent = text;
    const c = $('#navChip'); c.textContent = chip || ''; c.hidden = !chip;
  }

  updateGame = function update() {
    if (view !== 'team' || !T) return;
    const now = Date.now(), pos = Geo.pos;
    const weak = !pos || pos.acc > WEAK_ACC || now - pos.t > 30000;
    $('#sScore').textContent = T.score;
    $('#sProg').textContent = `${Object.keys(T.visited).length}/${totalStops()}`;
    $('#sTime').textContent = fmtTime(now - T.start);

    if (map && pos) {
      const ll = [pos.lat, pos.lng];
      if (!me) {
        meAcc = L.circle(ll, { radius: pos.acc, color: '#1F6FEB', weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
        me = L.circleMarker(ll, { radius: 9, color: '#fff', weight: 3, fillColor: '#1F6FEB', fillOpacity: 1, interactive: false }).addTo(map);
        if (!fitted) { map.setView(ll, 19); fitted = true; }
        else if (!map.getBounds().contains(ll)) map.fitBounds(L.latLngBounds([ll]).extend(map.getBounds()), { padding: [40, 40], maxZoom: 19 });
      } else { me.setLatLng(ll); meAcc.setLatLng(ll).setRadius(pos.acc); if (!map.getBounds().pad(-0.15).contains(ll)) map.panTo(ll); }
    }

    if (pos && !weak && !sheetOpen() && now >= T.lockUntil) {
      for (const t of traps()) {
        if (t.lat == null || T.warned[t.id] || T.fallen[t.id]) continue;
        const d = dist(pos, t);
        if (d <= WARN_R) { T.warned[t.id] = now; saveT(); openWarn(t, Math.max(1, Math.round(d))); break; }
      }
    }

    const tgt = target();
    drawMarks(tgt);
    if (activeWarn) return nav('stop', 'warn', 'Peligro', `Trampa a ${activeWarn.d} m: lean el aviso y desvíen`, 'Recalculando');
    if (now < T.lockUntil) return nav('warn', 'spin', Math.ceil((T.lockUntil - now) / 1000) + ' s', 'Recalculando… cayeron en una trampa', 'Esperen y sigan la ruta');
    if (!tgt) return nav('go', 'flag', '', 'Recorrido completo');
    const label = tgt.type === 'dest' ? 'Destino final: la capilla' : `Punto ${goodsDone() + 1} de ${goods().length}`;
    if (tgt.lat == null) return nav('off', 'qr', 'Bajo techo', `${label}${tgt.hint ? ' · ' + tgt.hint : ''}`, 'Busquen el cartel y escanéenlo');
    if (weak) {
      const denied = Geo.err === 'denied';
      return nav('off', 'nosig', denied ? 'Sin permiso' : 'Sin señal', `${label}${tgt.hint ? ' · ' + tgt.hint : ''}`, denied ? 'Activen la ubicación del navegador' : 'Sigan por la ruta y busquen el cartel');
    }
    const d = dist(pos, tgt), b = bearing(pos, tgt), h = Compass.heading;
    if (lastTgt === tgt.id && lastD != null) { if (d < lastD - 2) trend = 'Más cerca'; else if (d > lastD + 2) trend = 'Más lejos'; }
    else trend = '';
    if (lastTgt !== tgt.id || Math.abs(d - lastD) > 2) { lastD = d; lastTgt = tgt.id; }
    if (d <= ARRIVE_R) {
      if (!T.arrived[tgt.id]) { T.arrived[tgt.id] = now; saveT(); Sound.ping(); buzz(90); }
      return nav('go', 'flag', 'Llegaron', `${label} · busquen el cartel y escanéenlo`, 'Están en la zona');
    }
    nav('go', 'arrow', fmtDist(d), label + (tgt.hint ? ' · ' + tgt.hint : ''), trend || (h != null ? 'Brújula activa' : 'Flecha = norte del mapa'), h != null ? b - h : b);
  };

  const offGeo = Geo.on(() => updateGame());
  const iv = setInterval(() => updateGame(), 1000);
  cleanup.push(offGeo, () => clearInterval(iv), () => { updateGame = () => {}; });
  $('#scanBtn').onclick = openScanner;
  $('#codeBtn').onclick = openCode;
  $('#menuBtn').onclick = openMenu;
  if (!sim) keepAwake();
  updateGame();
}

let activeWarn = null;
function openWarn(t, d) {
  Sound.warn(); buzz([220, 90, 220, 90, 220]);
  activeWarn = { id: t.id, d };
  const opts = shuffle(t.options.map((o, i) => ({ o, i })));
  const w = openSheet(`<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Recalculando</div><h2>Reporte de peligro a ${d} m</h2></div>
    <div class="sheet-body">
      <p>Cerca hay un cartel que parece un buen camino, pero otros conductores lo reportaron. Léanlo juntos:</p>
      <div class="cartel-quote">«${esc(t.sign)}»</div>
      <p><b>${esc(t.q)}</b></p>
      <div class="opts">${opts.map(x => `<button class="opt" data-i="${x.i}">${esc(x.o)}</button>`).join('')}</div>
      <div class="feedback" hidden></div>
      <button class="btn primary block" id="wDone" hidden>Desviar y seguir</button>
    </div>`, () => { activeWarn = null; updateGame(); });
  updateGame();
  w.querySelector('.opts').addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b || T.avoided[t.id]) return;
    const ok = +b.dataset.i === t.ok;

    w.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (+o.dataset.i === t.ok) o.classList.add('ok'); else if (o === b) o.classList.add('no'); });
    const fb = w.querySelector('.feedback'); fb.hidden = false;
    fb.innerHTML = (ok ? '<div class="pts good">+50</div><p><b>¡Desvío a tiempo!</b></p>' : '<p><b>Esa no era.</b> La respuesta correcta está en verde.</p>') +
      `<p>${esc(t.why)}</p><p class="small">No escaneen ese cartel: es una trampa.</p>`;
    if (ok) Sound.good(); else Sound.tone(300, .3);
    w.querySelector('#wDone').hidden = false; updateGame();
  });
  w.querySelector('#wDone').onclick = closeSheet;
}

function handleCode(raw) {
  if (view !== 'team' || !T || T.done) return;
  const code = String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  const pr = BY_CODE[code];
  if (!pr) return sheetMsg('No reconozco ese código', 'Revisen las letras y números del cartel e inténtenlo de nuevo.');
  const p = gp(pr.id);
  if (!p) return sheetMsg('Ese cartel no está en el juego de hoy', 'Sigan buscando los puntos de su ruta.');
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  if (p.type === 'trap') return fallTrap(p);
  if (T.visited[p.id]) return sheetMsg('Ya pasaron por aquí', `«${p.sign}» ya está en su ruta. Sigan al próximo destino.`);
  if (p.type === 'dest') {
    const left = goods().filter(g => !T.visited[g.id]).length;
    if (left) return sheetMsg('Todavía no es el final', `Les falta${left > 1 ? 'n' : ''} ${left} punto${left > 1 ? 's' : ''} antes de llegar a la capilla.`);
  }
  T.visited[p.id] = Date.now(); T.score += 100;
  Sound.good(); buzz([60, 40, 60]);
  if (p.type === 'dest') { T.done = Date.now(); saveT(); return showFinal(); }
  saveT();
  const n = goodsDone(), tot = goods().length;
  const w = openSheet(`<div class="sheet-head"><div class="sh-k">Punto ${n} de ${tot}</div><h2>${esc(p.title)}</h2></div>
    <div class="sheet-body"><div class="pts good">+100</div><div class="cartel-quote">«${esc(p.sign)}»</div><p>${esc(p.body)}</p><p class="ref">${esc(p.ref)}</p>
    <button class="btn primary block">${n === tot ? 'Rumbo a la capilla' : 'Siguiente destino'}</button></div>`, () => updateGame());
  w.querySelector('.btn').onclick = closeSheet;
}

function fallTrap(t) {
  if (T.fallen[t.id]) return sheetMsg('Ya cayeron en esta trampa', 'No hace falta escanearla otra vez. Sigan la ruta del GPS.');
  T.fallen[t.id] = Date.now(); T.score -= 50; T.lockUntil = Date.now() + LOCK_MS; saveT();
  Sound.bad(); buzz([400, 120, 400]);
  const w = openSheet(`<div class="sheet-head stop"><div class="sh-k">${ICON.warn} Cayeron en una trampa</div><h2>«${esc(t.sign)}»</h2></div>
    <div class="sheet-body"><div class="pts bad">−50</div><p>${esc(t.why)}</p>
    <p class="small">El GPS está recalculando la ruta: esperen <span id="cd">15</span> segundos antes de seguir.</p>
    <button class="btn primary block">Entendido</button></div>`, () => updateGame());
  const iv = setInterval(() => { const el = w.querySelector('#cd'); if (!el) return clearInterval(iv); const s = Math.ceil((T.lockUntil - Date.now()) / 1000); if (s <= 0) { el.textContent = '0'; clearInterval(iv); } else el.textContent = s; }, 500);
  w.querySelector('.btn').onclick = closeSheet;
}

let camStream = null, camOn = false;
function stopCam() { camOn = false; if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function extractCode(v) {
  const m = /[#?&]c=([A-Za-z0-9]{3})/.exec(v); if (m) return m[1].toUpperCase();
  const t = String(v).trim().toUpperCase(); return /^[A-Z0-9]{3}$/.test(t) ? t : null;
}
async function openScanner() {
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  const w = openSheet(`<div class="sheet-head"><div class="sh-k">${ICON.scan} Escanear cartel</div><h2>Apunten la cámara al QR</h2></div>
    <div class="sheet-body"><div class="cam"><video id="vid" playsinline muted autoplay></video><div class="cam-frame"></div></div>
    <p class="small" id="camMsg">Antes de escanear, discutan juntos: ¿este cartel los lleva por buen camino?</p>
    <div class="row"><button class="btn" id="toCode" style="flex:1">Escribir código</button><button class="btn" id="camX" style="flex:1">Cerrar</button></div></div>`, stopCam);
  w.querySelector('#camX').onclick = closeSheet;
  w.querySelector('#toCode').onclick = () => { closeSheet(); openCode(); };
  const video = w.querySelector('#vid');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (sheetEl !== w) { stopCam(); return; }
    video.srcObject = camStream; await video.play();
  } catch (e) {

    return;
  }
  camOn = true;
  let detector = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (!camOn || sheetEl !== w) return;
    let val = null;
    if (video.readyState >= 2) {
      if (detector) { try { const r = await detector.detect(video); if (r && r[0]) val = r[0].rawValue; } catch (e) { detector = null; } }
      else if (window.jsQR && video.videoWidth) {
        const sc = Math.min(1, 640 / video.videoWidth);
        canvas.width = Math.round(video.videoWidth * sc); canvas.height = Math.round(video.videoHeight * sc);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }); if (r) val = r.data;
      }
    }
    if (val) {
      const code = extractCode(val);
      if (code) { closeSheet(); handleCode(code); return; }
      if (/#j=/.test(val)) { const m = w.querySelector('#camMsg'); if (m) m.textContent = 'Ese es el QR para unirse al juego. Escaneen el QR de un cartel.'; }
    }
    setTimeout(tick, 200);
  };
  tick();
}
function openCode() {
  if (Date.now() < T.lockUntil) return sheetMsg('Todavía están recalculando', 'Esperen a que termine la cuenta para escanear.', 'warn');
  const w = openSheet(`<div class="sheet-head off"><div class="sh-k">Código del cartel</div><h2>Escriban las 3 letras y números</h2></div>
    <div class="sheet-body"><form id="cf" style="display:grid;gap:12px"><input class="codein" id="codeIn" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="···" aria-label="Código del cartel">
    <button class="btn primary block" type="submit">Confirmar</button></form><button class="btn block" id="cX">Cancelar</button></div>`);
  setTimeout(() => { const i = w.querySelector('#codeIn'); if (i) i.focus(); }, 60);
  w.querySelector('#cf').onsubmit = e => { e.preventDefault(); const v = w.querySelector('#codeIn').value; closeSheet(); handleCode(v); };
  w.querySelector('#cX').onclick = closeSheet;
}
function openMenu() {
  const needCompass = Compass.needsPermission() && Compass.heading == null;
  const w = openSheet(`<div class="sheet-head off"><div class="sh-k">${esc(teamLabel(T))}</div><h2>Opciones</h2></div>
    <div class="sheet-body"><div class="menu">
      ${needCompass ? '<button class="btn block" data-m="compass">Activar brújula</button>' : ''}
      <button class="btn block" data-m="code">Escribir código de un cartel</button>
      <button class="btn block" data-m="home">Salir al inicio</button>
      <div id="mReset"><button class="btn danger block" data-m="reset">Reiniciar este equipo</button></div>
      <button class="btn primary block" data-m="close">Volver al recorrido</button>
    </div></div>`);
  w.addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m === 'close') closeSheet();
    if (m === 'compass') { Compass.start(); closeSheet(); toast('Brújula activada'); }
    if (m === 'code') { closeSheet(); openCode(); }
    if (m === 'home') showHome();
    if (m === 'reset') $('#mReset', w).innerHTML = '<p><b>¿Seguro?</b> Se pierden los puntos y el tiempo de este equipo.</p><div class="row"><button class="btn danger" data-m="resetYes" style="flex:1">Sí, reiniciar</button><button class="btn" data-m="close" style="flex:1">Cancelar</button></div>';
    if (m === 'resetYes') { store.del(tKey()); T = null; showTeam(); }
  });
}

function showFinal() {
  Geo.stop();
  const ok = Object.values(T.avoided).filter(a => a.ok).length, fell = Object.keys(T.fallen).length;
  setView('final', `<main class="page">
    <div class="hero-sign"><span class="hero-arrow">${ICON.flag}</span><p class="kicker light">Llegaron a la capilla · ${esc(teamLabel(T))}</p>
      <h1>${T.score} puntos</h1><p>Tiempo: ${fmtTime(T.done - T.start)}</p></div>
    <div class="stats3">
      <div><strong>${goodsDone()}</strong><span>puntos que guían</span></div>
      <div><strong>${ok}</strong><span>trampas detectadas</span></div>
      <div><strong>${fell}</strong><span>trampas en las que cayeron</span></div>
    </div>
    <div class="card"><p class="kicker">Frase del punto 1</p><h2>El Espíritu guía a sus hijos y les enseña a discernir juntos.</h2></div>
    <p>${esc(BY_ID.capilla.body)}</p>
    <p class="lead center"><b>Muéstrenle esta pantalla a su líder.</b></p>
    ${isSim() ? '<button class="btn primary block" id="fAgain">Probar de nuevo</button><a class="btn block" href="#lider">Volver al modo líder</a>' : '<button class="btn block" id="fHome">Inicio</button>'}
  </main>`);
  Sound.good();
  const a = $('#fAgain'); if (a) a.onclick = () => { store.del(tKey()); T = null; showTeam(); };
  const h = $('#fHome'); if (h) h.onclick = () => showHome();
}

route();
})();
</script>
